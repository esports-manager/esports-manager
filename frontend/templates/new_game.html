<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>eSports Manager - New Game</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='img/icons/bootstrap-icons.min.css') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/imgblur.css') }}" />
  </head>
  <body class="text-white">
    <div class="bg-blur"></div>

    <div
      class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12"
    >
      <div class="flex flex-col items-center gap-4 mb-8">
        <img
          id="logo"
          class="w-20 h-20"
          src="{{ url_for('static', path='img/logo.svg') }}"
          alt="eSports Manager"
        />
        <div class="text-center">
          <h1 class="text-3xl font-semibold">Start a New Career</h1>
          <p class="text-sm text-white/70">
            Choose your team and create a new session from the base database.
          </p>
        </div>
      </div>

      <div
        class="w-full max-w-2xl bg-white/90 text-slate-900 rounded-2xl shadow-2xl p-8 backdrop-blur"
      >
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-semibold">New Game Setup</h2>
            <p class="text-sm text-slate-500">Configure your manager profile.</p>
          </div>
          <a
            href="/"
            class="text-sm font-semibold text-blue-600 hover:text-blue-500"
            >Back to menu</a
          >
        </div>

        <form id="new-game-form" class="space-y-5">
          <div>
            <label for="manager-name" class="text-sm font-semibold text-slate-700"
              >Manager name</label
            >
            <input
              id="manager-name"
              name="manager_name"
              type="text"
              placeholder="Enter manager name"
              class="mt-2 w-full rounded-xl bg-slate-100 border border-transparent px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>

          <div>
            <label for="save-name" class="text-sm font-semibold text-slate-700"
              >Save name (optional)</label
            >
            <input
              id="save-name"
              name="name"
              type="text"
              placeholder="My first season"
              class="mt-2 w-full rounded-xl bg-slate-100 border border-transparent px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label for="team-select" class="text-sm font-semibold text-slate-700"
              >Choose your team</label
            >
            <select
              id="team-select"
              name="team_id"
              class="mt-2 w-full rounded-xl bg-slate-100 border border-transparent px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
              <option value="">Loading teams...</option>
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="seed" class="text-sm font-semibold text-slate-700"
                >Seed (optional)</label
              >
              <input
                id="seed"
                name="seed"
                type="number"
                min="0"
                placeholder="0"
                class="mt-2 w-full rounded-xl bg-slate-100 border border-transparent px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div class="flex flex-col justify-center">
              <details class="rounded-xl bg-slate-100 px-4 py-3">
                <summary class="cursor-pointer text-sm font-semibold text-slate-700">
                  Advanced base database
                </summary>
                <input
                  id="base-db"
                  name="base_database_url"
                  type="text"
                  placeholder="sqlite+aiosqlite:///path/to/app.db"
                  class="mt-3 w-full rounded-lg bg-white border border-slate-200 px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </details>
            </div>
          </div>

          <p id="new-game-error" class="text-sm text-red-600"></p>

          <div class="flex items-center justify-between gap-3">
            <a
              href="/load_game"
              class="text-sm font-semibold text-slate-600 hover:text-slate-500"
              >Already have a save?</a
            >
            <button
              id="new-game-submit"
              type="submit"
              class="px-6 py-3 rounded-xl text-white bg-blue-600 hover:bg-blue-500 text-lg font-semibold shadow"
            >
              Create save
            </button>
          </div>
          <p id="new-game-loading" class="text-xs text-slate-500 hidden">
            Creating session...
          </p>
        </form>
      </div>
    </div>

    <script>
      const teamSelect = document.getElementById("team-select");
      const form = document.getElementById("new-game-form");
      const errorEl = document.getElementById("new-game-error");
      const submitBtn = document.getElementById("new-game-submit");
      const loadingEl = document.getElementById("new-game-loading");

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.classList.toggle("opacity-60", isLoading);
        submitBtn.classList.toggle("cursor-not-allowed", isLoading);
        loadingEl.classList.toggle("hidden", !isLoading);
      }

      async function loadTeams() {
        try {
          const response = await fetch("/api/moba/teams/options");
          if (!response.ok) {
            throw new Error("Unable to load teams.");
          }
          const teams = await response.json();
          teamSelect.innerHTML = "<option value=\"\">Select a team</option>";
          teams.forEach((team) => {
            const option = document.createElement("option");
            option.value = team.id;
            option.textContent = team.name;
            teamSelect.appendChild(option);
          });
        } catch (error) {
          teamSelect.innerHTML = "<option value=\"\">No teams available</option>";
          errorEl.textContent = error.message;
        }
      }

      async function submitNewGame(event) {
        event.preventDefault();
        errorEl.textContent = "";

        const managerName = document.getElementById("manager-name").value.trim();
        const teamId = Number(teamSelect.value || 0);
        const saveName = document.getElementById("save-name").value.trim();
        const seedValue = document.getElementById("seed").value;
        const baseDb = document.getElementById("base-db").value.trim();

        if (!managerName) {
          errorEl.textContent = "Manager name is required.";
          return;
        }
        if (!teamId) {
          errorEl.textContent = "Please select a team.";
          return;
        }

        const payload = {
          manager_name: managerName,
          team_id: teamId,
        };
        if (saveName) payload.name = saveName;
        if (seedValue) payload.seed = Number(seedValue);
        if (baseDb) payload.base_database_url = baseDb;

        setLoading(true);
        try {
          const response = await fetch("/api/moba/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data?.detail || "Unable to create a new save.");
          }
          localStorage.setItem("activeSessionId", String(data.id));
          localStorage.setItem("activeSessionName", data.name || "");
          localStorage.setItem("activeSessionTeam", String(data.team_id || ""));
          window.location.href = `/home?session_id=${data.id}`;
        } catch (error) {
          errorEl.textContent = error.message;
        } finally {
          setLoading(false);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadTeams();
        form.addEventListener("submit", submitNewGame);
      });
    </script>
  </body>
</html>
