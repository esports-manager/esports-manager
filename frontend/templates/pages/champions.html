<div class="m-8" x-data="{
  championsActiveTab: $persist('champions').using(sessionStorage),
  view: $persist('grid').using(sessionStorage),
  searchQuery: '',
  selectedRole: '',
  selectedDifficulty: '',
  selectedMetaTier: '',
  selectedPatch: '',
  sortBy: 'name',
  sortDirection: 'asc',
  metaTab: 'overview',
  perPage: '20',
  showFilters: false,
  updateChampionsList() {
    document.getElementById('per-page-input').value = this.perPage;
    document.getElementById('champion-filters-form').dispatchEvent(new Event('submit'));
  }
}">
  <!-- Page Header -->
  <!-- Page Header with Quick Meta Stats -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Champions</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Browse champions and current meta trends</p>
    </div>

    <!-- View Toggle -->
    <div class="flex items-center bg-gray-100 dark:bg-slate-700 rounded-lg p-1">
      <button @click="view = 'grid'" :class="{'bg-white dark:bg-slate-600 shadow': view === 'grid'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150">
        <i class="bi bi-grid mr-1"></i> Grid
      </button>
      <button @click="view = 'list'" :class="{'bg-white dark:bg-slate-600 shadow': view === 'list'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150">
        <i class="bi bi-list-ul mr-1"></i> List
      </button>
    </div>
  </div>

  <!-- Main Navigation Tabs -->
  <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
    <div class="flex overflow-x-auto overflow-y-hidden">
      <button @click="championsActiveTab = 'champions'"
        :class="{'border-blue-500 text-blue-600 dark:text-blue-400': championsActiveTab === 'champions', 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300': championsActiveTab !== 'champions'}"
        class="flex items-center h-14 px-4 -mb-px text-sm font-medium border-b-2 whitespace-nowrap focus:outline-none">
        <i class="bi bi-file-earmark-text mr-2"></i>
        Champions
      </button>
      <button @click="championsActiveTab = 'meta'"
        :class="{'border-blue-500 text-blue-600 dark:text-blue-400': championsActiveTab === 'meta', 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300': championsActiveTab !== 'meta'}"
        class="flex items-center h-14 px-4 -mb-px text-sm font-medium border-b-2 whitespace-nowrap focus:outline-none">
        <i class="bi bi-lightning mr-2"></i>
        Meta
      </button>
    </div>
  </div>

  <!-- Meta Overview Section -->
  <!-- Meta Analysis Section with Role Tabs -->
  <div x-show="championsActiveTab === 'meta'" class="bg-white dark:bg-slate-700 rounded-lg shadow mb-6 overflow-hidden">
    {% include "components/champions_meta.html" %}
  </div>

  <div x-show="championsActiveTab === 'champions'">
    <!-- Filters and Search -->
    <!-- Filters and Search Section -->
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-4 mb-4">
      <!-- Search & Filters Form -->
      <form id="champion-filters-form" hx-get="/api/moba/champions"
        hx-trigger="input delay:300ms from:#search-input, change from:#role-filter, change from:#difficulty-filter, change from:#tier-filter, change from:#sort-filter, change from:#sort-direction-toggle, change from:#per-page-input, submit"
        hx-include="#champion-filters-form" hx-swap="innerHTML" hx-target="#champ-list">

        <!-- Search Bar (Full Width) with Filter Toggle -->
        <div class="relative w-full mb-3">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="bi bi-search text-gray-500 dark:text-gray-400"></i>
          </div>
          <input id="search-input" type="text" name="search" x-model="searchQuery" placeholder="Search champions..."
            class="pl-10 pr-12 py-2 w-full rounded-lg bg-gray-100 dark:bg-slate-600 border-0 focus:ring-2 focus:ring-blue-500 text-sm shadow-sm">

          <!-- Filter Toggle Button -->
          <button type="button" @click="showFilters = !showFilters"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 transition-colors">
            <i class="bi" :class="showFilters ? 'bi-funnel-fill' : 'bi-funnel'"></i>
            <span class="text-xs ml-1" x-text="showFilters ? 'Hide Filters' : 'Show Filters'"></span>
          </button>
        </div>

        <!-- Filter Dropdowns (Collapsible) -->
        <div x-show="showFilters" x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 transform -translate-y-2"
          x-transition:enter-end="opacity-100 transform translate-y-0">

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 mt-2">
            <!-- Role Filter -->
            <div class="col-span-1">
              <label for="role-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Role</label>
              <select id="role-filter" name="role" x-model="selectedRole" aria-label="Filter by role"
                @change="updateChampionsList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="">All Roles</option>
                <option value="top">Top Lane</option>
                <option value="jungle">Jungle</option>
                <option value="mid">Mid Lane</option>
                <option value="bot">Bot Lane</option>
                <option value="support">Support</option>
              </select>
            </div>

            <!-- Difficulty Filter -->
            <div class="col-span-1">
              <label for="difficulty-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Difficulty</label>
              <select id="difficulty-filter" name="difficulty" x-model="selectedDifficulty"
                @change="updateChampionsList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="">All Difficulties</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>

            <!-- Meta Tier Filter -->
            <div class="col-span-1">
              <label for="tier-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Meta Tier</label>
              <select id="tier-filter" name="tier" x-model="selectedMetaTier"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm"
                @change="updateChampionsList()">
                <option value="">All Meta Tiers</option>
                <option value="s+">S+ Tier</option>
                <option value="s">S Tier</option>
                <option value="a">A Tier</option>
                <option value="b">B Tier</option>
                <option value="c">C Tier</option>
                <option value="d">D Tier</option>
                <option value="f">F Tier</option>
              </select>
            </div>

            <!-- Sort By -->
            <div class="col-span-1">
              <label for="sort-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Sort By</label>
              <select id="sort-filter" name="sort" x-model="sortBy" @change="updateChampionsList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="name">Name</option>
                <option value="winrate">Win Rate</option>
                <option value="pickrate">Pick Rate</option>
                <option value="banrate">Ban Rate</option>
              </select>
            </div>

            <!-- Sort Direction & Hidden Input -->
            <div class="col-span-1 flex flex-col">
              <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Order</label>
              <div class="flex">
                <button id="sort-direction-toggle"
                  @click="sortDirection = sortDirection === 'asc' ? 'desc' : 'asc'; updateChampionsList();"
                  type="button"
                  class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-slate-600 dark:hover:bg-slate-500 rounded-md px-2 py-1.5 text-xs flex items-center justify-center shadow-sm">
                  <i :class="sortDirection === 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'"
                    class="mr-1"></i>
                  <span x-text="sortDirection === 'asc' ? 'Asc' : 'Desc'"></span>
                </button>
              </div>
              <!-- Hidden inputs -->
              <input id="per-page-input" type="hidden" name="per_page" :value="perPage">
              <input type="hidden" name="direction" :value="sortDirection">
            </div>
          </div>
        </div> <!-- End of collapsible filters section -->

        <!-- View Controls - Always Visible -->
        <div class="flex flex-wrap items-center justify-between mt-3 mb-1">
          <!-- Per page selector -->
          <div class="flex items-center">
            <label for="per-page-select" class="text-xs font-medium text-gray-600 dark:text-gray-400 mr-2">Per
              page:</label>
            <select id="per-page-select" x-model="perPage" @change="updateChampionsList()"
              class="text-xs bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-700 dark:text-gray-300 px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500 shadow-sm">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- Active Filters Display -->
    <div class="mt-3 flex flex-wrap gap-2"
      x-show="selectedRole !== '' || selectedDifficulty !== '' || selectedMetaTier !== '' || searchQuery !== ''">
      <span class="text-xs text-gray-500 dark:text-gray-400 self-center">Active filters:</span>

      <!-- Role Filter Tag -->
      <div x-show="selectedRole !== ''"
        class="bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs px-2 py-1 rounded-full flex items-center">
        Role: <span x-text="selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1)"
          class="font-medium mx-1"></span>
        <button @click="selectedRole = ''" class="ml-1 hover:text-blue-600 dark:hover:text-blue-100">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>

      <!-- Difficulty Filter Tag -->
      <div x-show="selectedDifficulty !== ''"
        class="bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 text-xs px-2 py-1 rounded-full flex items-center">
        Difficulty: <span x-text="selectedDifficulty.charAt(0).toUpperCase() + selectedDifficulty.slice(1)"
          class="font-medium mx-1"></span>
        <button @click="selectedDifficulty = ''" class="ml-1 hover:text-green-600 dark:hover:text-green-100">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>

      <!-- Meta Tier Filter Tag -->
      <div x-show="selectedMetaTier !== ''"
        class="bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 text-xs px-2 py-1 rounded-full flex items-center">
        Meta Tier: <span x-text="selectedMetaTier.toUpperCase() + ' Tier'" class="font-medium mx-1"></span>
        <button @click="selectedMetaTier = ''" class="ml-1 hover:text-purple-600 dark:hover:text-purple-100">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>

      <!-- Search Query Tag -->
      <div x-show="searchQuery !== ''"
        class="bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200 text-xs px-2 py-1 roundefd-full flex items-center">
        Search: <span x-text="searchQuery" class="font-medium mx-1"></span>
        <button @click="searchQuery = ''" class="ml-1 hover:text-yellow-600 dark:hover:text-yellow-100">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>

      <!-- Clear All Filters -->
      <button
        @click="selectedRole = ''; selectedDifficulty = ''; selectedMetaTier = ''; searchQuery = ''; 
                      $nextTick(() => document.getElementById('champion-filters-form').dispatchEvent(new Event('submit')));"
        class="text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 underline ml-2">
        Clear all
      </button>
    </div>

    <div id="champ-list">
      <div id="champions-container">
        {% include "components/champions_skeleton.html" %}
      </div>
    </div>
  </div>
</div>
