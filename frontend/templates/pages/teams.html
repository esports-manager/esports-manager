<div class="m-8" x-data="{
    activeTab: 'teams',
    view: 'grid',
    searchQuery: '',
    selectedRegion: '',
    selectedLeague: '',
    selectedTier: '',
    sortBy: 'name',
    sortDirection: 'asc',
    showAdvancedFilters: false,
    isLoading: true
  }" x-init="
    $nextTick(() => {
      isLoading = true;
    })
  ">
  <!-- Page Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">Teams</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Browse and filter all esports teams</p>
    </div>

    <!-- View Toggle -->
    <div class="flex items-center bg-gray-100 dark:bg-slate-700 rounded-lg p-1">
      <button @click="view = 'grid'" :class="{'bg-white dark:bg-slate-600 shadow': view === 'grid'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150">
        <i class="bi bi-grid mr-1"></i> Grid
      </button>
      <button @click="view = 'list'" :class="{'bg-white dark:bg-slate-600 shadow': view === 'list'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150">
        <i class="bi bi-list-ul mr-1"></i> List
      </button>
    </div>
  </div>

  <!-- Filters and Search -->
  <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-4 mb-6">
    <form id="team-filters-form" hx-get="/api/moba/teams" hx-target="#teams-list" hx-trigger="submit"
      hx-indicator="#loading-indicator"
      x-on:submit="isLoading = true; $event.preventDefault(); htmx.trigger(this, 'submit')">
      <div class="flex flex-col lg:flex-row gap-4">
        <!-- Search -->
        <div class="relative flex-grow">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="bi bi-search text-gray-500 dark:text-gray-400"></i>
          </div>
          <input type="text" x-model="searchQuery" name="search" placeholder="Search teams..."
            class="pl-10 pr-4 py-2 w-full rounded-lg bg-gray-100 dark:bg-slate-600 border-0 focus:ring-2 focus:ring-blue-500"
            @input.debounce.300ms="$el.form.dispatchEvent(new Event('submit'))">
        </div>

        <!-- Filter Dropdowns -->
        <div class="flex flex-wrap gap-2">
          <!-- League Filter -->
          <select x-model="selectedLeague" name="league"
            class="bg-gray-100 dark:bg-slate-600 border-0 rounded-lg text-gray-800 dark:text-gray-200 text-sm px-3 py-2"
            @change="$el.form.dispatchEvent(new Event('submit'))">
            <option value="all">All Leagues</option>
            <option value="lec">LEC (Europe)</option>
            <option value="lcs">LCS (North America)</option>
            <option value="lck">LCK (Korea)</option>
            <option value="lpl">LPL (China)</option>
            <option value="minor">Minor Leagues</option>
          </select>

          <!-- Region Filter -->
          <select x-model="selectedRegion" name="region"
            class="bg-gray-100 dark:bg-slate-600 border-0 rounded-lg text-gray-800 dark:text-gray-200 text-sm px-3 py-2"
            @change="$el.form.dispatchEvent(new Event('submit'))">
            <option value="all">All Regions</option>
            <option value="eu">Europe</option>
            <option value="na">North America</option>
            <option value="kr">Korea</option>
            <option value="cn">China</option>
            <option value="sea">Southeast Asia</option>
          </select>

          <!-- Tier Filter -->
          <select x-model="selectedTier" name="tier"
            class="bg-gray-100 dark:bg-slate-600 border-0 rounded-lg text-gray-800 dark:text-gray-200 text-sm px-3 py-2"
            @change="$el.form.dispatchEvent(new Event('submit'))">
            <option value="all">All Tiers</option>
            <option value="s">S Tier</option>
            <option value="a">A Tier</option>
            <option value="b">B Tier</option>
            <option value="c">C Tier</option>
            <option value="d">D Tier</option>
          </select>

          <!-- Sort Options -->
          <select x-model="sortBy" name="sort_by"
            class="bg-gray-100 dark:bg-slate-600 border-0 rounded-lg text-gray-800 dark:text-gray-200 text-sm px-3 py-2"
            @change="$el.form.dispatchEvent(new Event('submit'))">
            <option value="name">Sort by Name</option>
            <option value="rating">Sort by Rating</option>
            <option value="championships">Sort by Championships</option>
            <option value="fans">Sort by Fanbase</option>
          </select>

          <input type="hidden" name="sort_direction" x-bind:value="sortDirection">
          <input type="hidden" name="view" x-bind:value="view">

          <!-- Sort Direction Toggle -->
          <button @click="sortDirection = sortDirection === 'asc' ? 'desc' : 'asc'"
            class="bg-gray-100 hover:bg-gray-200 dark:bg-slate-600 dark:hover:bg-slate-500 rounded-lg px-3 py-2 text-sm">
            <i :class="sortDirection === 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'"></i>
          </button>
        </div>
      </div>

    </form>

    <!-- Active Filters -->
    <div class="mt-3 flex flex-wrap gap-2"
      x-show="selectedLeague !== '' || selectedRegion !== '' || selectedTier !== '' || searchQuery !== ''">
      <span class="text-xs text-gray-500 dark:text-gray-400 self-center">Active filters:</span>

      <!-- League Filter Tag -->
      <div x-show="selectedLeague !== ''"
        class="flex items-center text-xs bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-2 py-1 rounded-full">
        <span>League: <span x-text="selectedLeague.toUpperCase()"></span></span>
        <button
          @click="selectedLeague = ''; $nextTick(() => document.getElementById('team-filters-form').dispatchEvent(new Event('submit')))"
          class="ml-1 text-blue-500 hover:text-blue-700 focus:outline-none">
          <i class="bi bi-x-circle"></i>
        </button>
      </div>

      <!-- Region Filter Tag -->
      <div x-show="selectedRegion !== ''"
        class="flex items-center text-xs bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 px-2 py-1 rounded-full">
        <span>Region: <span
            x-text="selectedRegion === 'na' ? 'North America' : selectedRegion === 'kr' ? 'Korea' : selectedRegion === 'cn' ? 'China' : selectedRegion === 'eu' ? 'Europe' : selectedRegion === 'sea' ? 'Southeast Asia' : selectedRegion.toUpperCase()"></span></span>
        <button
          @click="selectedRegion = ''; $nextTick(() => document.getElementById('team-filters-form').dispatchEvent(new Event('submit')))"
          class="ml-1 text-green-500 hover:text-green-700 focus:outline-none">
          <i class="bi bi-x-circle"></i>
        </button>
      </div>

      <!-- Tier Filter Tag -->
      <div x-show="selectedTier !== ''"
        class="flex items-center text-xs bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 px-2 py-1 rounded-full">
        <span>Tier: <span x-text="selectedTier.toUpperCase() + ' Tier'"></span></span>
        <button
          @click="selectedTier = ''; $nextTick(() => document.getElementById('team-filters-form').dispatchEvent(new Event('submit')))"
          class="ml-1 text-purple-500 hover:text-purple-700 focus:outline-none">
          <i class="bi bi-x-circle"></i>
        </button>
      </div>

      <!-- Search Filter Tag -->
      <div x-show="searchQuery !== ''"
        class="flex items-center text-xs bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200 px-2 py-1 rounded-full">
        <span>Search: <span x-text="searchQuery"></span></span>
        <button
          @click="searchQuery = ''; $nextTick(() => document.getElementById('team-filters-form').dispatchEvent(new Event('submit')))"
          class="ml-1 text-yellow-500 hover:text-yellow-700 focus:outline-none">
          <i class="bi bi-x-circle"></i>
        </button>
      </div>

      <!-- Clear All Filters -->
      <button @click="selectedLeague = ''; selectedRegion = ''; selectedTier = ''; searchQuery = '';
                     $nextTick(() => document.getElementById('team-filters-form').dispatchEvent(new Event('submit')))"
        class="text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 ml-auto">
        Clear All
      </button>
    </div>
  </div>

  <!-- Teams Content Container -->
  <div id="teams-list">
    <!-- Initial loading skeleton will be replaced by HTMX -->
    {% include "components/teams_skeleton.html" %}
  </div>
</div>
