[package]
name = "db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
app.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
dirs.workspace = true
domain.workspace = true
esports.workspace = true
getrandom.workspace = true
# Bundled SQLite, so every platform runs the same SQLite (ADR 0004).
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }

[dev-dependencies]
esports = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# libsqlite3-sys is only there to turn on its `bundled` feature (ADR 0004);
# no code names it.
[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]
