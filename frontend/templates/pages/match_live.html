<div class="py-6" x-data="{ 
  autoScroll: true, 
  compactView: false,
  simId: '{{ sim_id }}',
  state: null,
  commentary: [],
  lastCommentaryIndex: 0
}" x-init="
  setInterval(async () => {
    const response = await fetch(`/api/moba/simulation/state/${simId}`);
    state = await response.json();
    if (state.commentary.length > lastCommentaryIndex) {
      commentary = state.commentary.slice(lastCommentaryIndex);
      lastCommentaryIndex = state.commentary.length;
      if (autoScroll) {
        $nextTick(() => {
          const feed = document.getElementById('event-feed');
          if (feed) feed.scrollTop = feed.scrollHeight;
        });
      }
    }
  }, 1000);
">
  <!-- Match Header -->
  <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white rounded-2xl p-6 mb-6 shadow-lg border border-slate-700/60">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
      <!-- Blue Team -->
      <div class="flex items-center gap-4 justify-start">
        <template x-if="state">
          <div class="flex items-center gap-4">
            <div class="h-12 w-12 rounded-full bg-blue-500/20 border border-blue-400/40 flex items-center justify-center overflow-hidden">
              <template x-if="state.team1.team.logo_path">
                <img :src="state.team1.team.logo_path" :alt="state.team1.team.name" class="h-full w-full object-cover" />
              </template>
              <template x-if="!state.team1.team.logo_path">
                <span class="text-lg font-bold text-blue-200">B</span>
              </template>
            </div>
            <div>
              <div class="text-2xl font-bold" x-text="state.team1.team.name"></div>
              <div class="text-sm text-blue-100/80" x-text="`${state.team1.summary.kills} K • ${state.team1.summary.deaths} D • ${state.team1.summary.assists} A`"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Match Time & Status -->
      <div class="text-center">
        <template x-if="state">
          <div>
            <div class="text-4xl font-extrabold tracking-wide" x-text="`${state.minutes}:${state.seconds.toString().padStart(2, '0')}`"></div>
            <div class="mt-2 text-xs uppercase tracking-[0.2em] text-white/70" x-text="state.status"></div>
            <div class="mt-3 flex items-center justify-center gap-4">
              <div class="text-3xl font-bold text-blue-200" x-text="state.team1.summary.kills"></div>
              <div class="text-xs uppercase tracking-[0.2em] text-white/60">Kills</div>
              <div class="text-3xl font-bold text-red-200" x-text="state.team2.summary.kills"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Red Team -->
      <div class="flex items-center gap-4 justify-end">
        <template x-if="state">
          <div class="flex items-center gap-4">
            <div class="text-right">
              <div class="text-2xl font-bold" x-text="state.team2.team.name"></div>
              <div class="text-sm text-red-100/80" x-text="`${state.team2.summary.kills} K • ${state.team2.summary.deaths} D • ${state.team2.summary.assists} A`"></div>
            </div>
            <div class="h-12 w-12 rounded-full bg-red-500/20 border border-red-400/40 flex items-center justify-center overflow-hidden">
              <template x-if="state.team2.team.logo_path">
                <img :src="state.team2.team.logo_path" :alt="state.team2.team.name" class="h-full w-full object-cover" />
              </template>
              <template x-if="!state.team2.team.logo_path">
                <span class="text-lg font-bold text-red-200">R</span>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    <template x-if="state">
      <div class="mt-6">
        <div class="flex items-center justify-between text-xs uppercase tracking-[0.2em] text-white/70">
          <span>Win Probability</span>
          <div class="flex items-center gap-2">
            <span class="text-blue-200" x-text="`${(state.team1.state.win_probability * 100).toFixed(0)}%`"></span>
            <span class="text-white/40">/</span>
            <span class="text-red-200" x-text="`${(state.team2.state.win_probability * 100).toFixed(0)}%`"></span>
          </div>
        </div>
        <div class="mt-2 h-2 rounded-full bg-white/10 overflow-hidden">
          <div class="h-full bg-blue-400" :style="`width: ${(state.team1.state.win_probability * 100).toFixed(0)}%`"></div>
        </div>
      </div>
    </template>
  </div>

  <!-- Control Panel -->
  <div class="bg-white/90 dark:bg-slate-800 rounded-2xl p-4 mb-6 shadow-lg border border-slate-200/70 dark:border-slate-700">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3">
        <template x-if="state && state.paused">
          <button 
            @click="fetch(`/api/moba/simulation/resume/${simId}`, { method: 'POST' })"
            class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2">
            <i class="bi bi-play-fill"></i> Resume
          </button>
        </template>
        <template x-if="state && !state.paused">
          <button 
            @click="fetch(`/api/moba/simulation/pause/${simId}`, { method: 'POST' })"
            class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 flex items-center gap-2">
            <i class="bi bi-pause-fill"></i> Pause
          </button>
        </template>

        <template x-if="state">
          <span
            class="px-3 py-1 rounded-full text-[10px] uppercase tracking-wide font-semibold"
            :class="state.paused ? 'bg-yellow-100 text-yellow-800' : 'bg-emerald-100 text-emerald-800'"
            x-text="state.paused ? 'Paused' : 'Live'">
          </span>
        </template>
        
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-300">Speed</span>
          <template x-if="state">
            <select 
              x-model="state.speed"
              @change="fetch(`/api/moba/simulation/speed/${simId}?speed=${state.speed}`, { method: 'POST' })"
              class="px-3 py-1 border dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 dark:text-white text-sm">
              <option value="0.5">0.5x</option>
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
            </select>
          </template>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-4">
        <label class="flex items-center gap-2 text-xs uppercase tracking-wide text-gray-500 dark:text-gray-200">
          <input type="checkbox" x-model="autoScroll" class="rounded border-gray-300 text-purple-600 focus:ring-purple-500">
          Auto-scroll
        </label>
        <label class="flex items-center gap-2 text-xs uppercase tracking-wide text-gray-500 dark:text-gray-200">
          <input type="checkbox" x-model="compactView" class="rounded border-gray-300 text-purple-600 focus:ring-purple-500">
          Compact view
        </label>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Team Stats - Blue -->
    <div class="col-span-12 lg:col-span-3 space-y-4">
      <div class="bg-white/90 dark:bg-slate-800 rounded-2xl p-4 shadow border border-slate-200/70 dark:border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-blue-600 rounded-full"></span>
            <template x-if="state">
              <span class="font-semibold dark:text-white" x-text="state.team1.team.name"></span>
            </template>
          </div>
          <template x-if="state">
            <span class="text-xs font-semibold text-blue-600 dark:text-blue-200"
              x-text="`${(state.team1.state.win_probability * 100).toFixed(0)}% Win`"></span>
          </template>
        </div>
        <template x-if="state">
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="rounded-lg bg-blue-50 dark:bg-blue-900/30 p-2">
              <div class="text-[10px] uppercase tracking-wide text-blue-600 dark:text-blue-200">Towers</div>
              <div class="text-lg font-semibold text-blue-800 dark:text-blue-100" x-text="state.team1.summary.towers_remaining"></div>
            </div>
            <div class="rounded-lg bg-slate-50 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Dragons</div>
              <div class="text-lg font-semibold text-slate-800 dark:text-white" x-text="state.team1.state.dragons"></div>
            </div>
            <div class="rounded-lg bg-slate-50 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Barons</div>
              <div class="text-lg font-semibold text-slate-800 dark:text-white" x-text="state.team1.state.barons"></div>
            </div>
            <div class="rounded-lg bg-slate-50 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Grubs</div>
              <div class="text-lg font-semibold text-slate-800 dark:text-white" x-text="state.team1.state.grubs"></div>
            </div>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-3 text-xs">
            <div class="rounded-lg bg-slate-900/5 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">KDA</div>
              <div class="text-base font-semibold text-slate-800 dark:text-white" x-text="state.team1.summary.kda"></div>
            </div>
            <div class="rounded-lg bg-slate-900/5 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Points</div>
              <div class="text-base font-semibold text-slate-800 dark:text-white" x-text="state.team1.summary.points"></div>
            </div>
          </div>
        </template>
      </div>

      <div class="bg-white/90 dark:bg-slate-800 rounded-2xl p-4 shadow border border-slate-200/70 dark:border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <h4 class="text-[11px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Players</h4>
          <span class="text-[11px] uppercase tracking-wide text-slate-400 dark:text-slate-400">K/D/A • CS</span>
        </div>
        <template x-if="state">
          <div class="space-y-2">
            <template x-for="player in state.team1.players" :key="player.id">
              <div class="flex items-center gap-3 rounded-lg border border-slate-100 dark:border-slate-700 p-2 bg-white/80 dark:bg-slate-700/60">
                <img
                  :src="player.champion.image_path || '/static/img/placeholders/champion_default.webp'"
                  :alt="player.champion.name"
                  class="h-10 w-10 rounded-lg object-cover"
                />
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold dark:text-white" x-text="player.name"></span>
                    <template x-if="player.role">
                      <span class="text-[10px] uppercase px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-200" x-text="player.role"></span>
                    </template>
                  </div>
                  <div class="text-xs text-slate-500 dark:text-slate-300" x-text="player.champion.name"></div>
                </div>
                <div class="text-xs text-slate-500 dark:text-slate-200 text-right">
                  <div x-text="`${player.kills}/${player.deaths}/${player.assists}`"></div>
                  <div class="text-[10px]" x-text="`${player.farm} CS`"></div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Event Feed -->
    <div class="col-span-12 lg:col-span-6">
      <div class="bg-white/90 dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200/70 dark:border-slate-700">
        <div class="p-4 border-b dark:border-slate-700 flex items-center justify-between">
          <div>
            <h3 class="font-bold dark:text-white">Live Commentary</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Auto-updating feed</p>
          </div>
          <template x-if="state">
            <span class="text-[10px] uppercase tracking-wide text-slate-400" x-text="`Events: ${state.commentary.length}`"></span>
          </template>
        </div>
        <div id="event-feed" class="h-[32rem] overflow-y-auto p-4 space-y-3" :class="{ 'space-y-2': compactView }">
          <template x-if="state">
            <template x-for="(event, index) in state.commentary" :key="index">
              <div 
                class="p-3 rounded-lg border-l-4 transition-all bg-white/80 dark:bg-slate-700/70 hover:bg-slate-50 dark:hover:bg-slate-600"
                :class="{
                  'border-blue-500 bg-blue-50 dark:bg-blue-900/20': event.includes('FIRST') || event.includes('First'),
                  'border-red-500 bg-red-50 dark:bg-red-900/20': event.includes('ACE') || event.includes('BARON'),
                  'border-yellow-500 bg-yellow-50 dark:bg-yellow-900/20': event.includes('inhibitor') || event.includes('INHIBITOR'),
                  'border-green-500 bg-green-50 dark:bg-green-900/20': event.includes('dragon') || event.includes('Dragon'),
                  'border-purple-500 bg-purple-50 dark:bg-purple-900/20': event.includes('NEXUS') || event.includes('wins'),
                  'border-gray-300 bg-white dark:bg-slate-700 dark:border-slate-600': !event.includes('FIRST') && !event.includes('ACE') && !event.includes('BARON') && !event.includes('inhibitor') && !event.includes('dragon') && !event.includes('NEXUS'),
                  'p-2 text-sm': compactView
                }"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 transform translate-y-2"
                x-transition:enter-end="opacity-100 transform translate-y-0">
                <div class="flex items-start justify-between gap-3">
                  <div class="flex-1">
                    <span 
                      class="dark:text-white"
                      :class="{ 
                        'font-bold text-lg': event.includes('FIRST') || event.includes('ACE') || event.includes('BARON') || event.includes('NEXUS'),
                        'font-medium': !compactView
                      }"
                      x-text="event">
                    </span>
                  </div>
                  <span class="text-xs text-gray-500 dark:text-gray-300 whitespace-nowrap">
                    <template x-if="state">
                      <span x-text="`${state.minutes}:${state.seconds.toString().padStart(2, '0')}`"></span>
                    </template>
                  </span>
                </div>
              </div>
            </template>
          </template>
        </div>
      </div>
    </div>

    <!-- Team Stats - Red -->
    <div class="col-span-12 lg:col-span-3 space-y-4">
      <div class="bg-white/90 dark:bg-slate-800 rounded-2xl p-4 shadow border border-slate-200/70 dark:border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-red-600 rounded-full"></span>
            <template x-if="state">
              <span class="font-semibold dark:text-white" x-text="state.team2.team.name"></span>
            </template>
          </div>
          <template x-if="state">
            <span class="text-xs font-semibold text-red-600 dark:text-red-200"
              x-text="`${(state.team2.state.win_probability * 100).toFixed(0)}% Win`"></span>
          </template>
        </div>
        <template x-if="state">
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="rounded-lg bg-red-50 dark:bg-red-900/30 p-2">
              <div class="text-[10px] uppercase tracking-wide text-red-600 dark:text-red-200">Towers</div>
              <div class="text-lg font-semibold text-red-800 dark:text-red-100" x-text="state.team2.summary.towers_remaining"></div>
            </div>
            <div class="rounded-lg bg-slate-50 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Dragons</div>
              <div class="text-lg font-semibold text-slate-800 dark:text-white" x-text="state.team2.state.dragons"></div>
            </div>
            <div class="rounded-lg bg-slate-50 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Barons</div>
              <div class="text-lg font-semibold text-slate-800 dark:text-white" x-text="state.team2.state.barons"></div>
            </div>
            <div class="rounded-lg bg-slate-50 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Grubs</div>
              <div class="text-lg font-semibold text-slate-800 dark:text-white" x-text="state.team2.state.grubs"></div>
            </div>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-3 text-xs">
            <div class="rounded-lg bg-slate-900/5 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">KDA</div>
              <div class="text-base font-semibold text-slate-800 dark:text-white" x-text="state.team2.summary.kda"></div>
            </div>
            <div class="rounded-lg bg-slate-900/5 dark:bg-slate-700/60 p-2">
              <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Points</div>
              <div class="text-base font-semibold text-slate-800 dark:text-white" x-text="state.team2.summary.points"></div>
            </div>
          </div>
        </template>
      </div>

      <div class="bg-white/90 dark:bg-slate-800 rounded-2xl p-4 shadow border border-slate-200/70 dark:border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <h4 class="text-[11px] uppercase tracking-wide text-slate-500 dark:text-slate-300">Players</h4>
          <span class="text-[11px] uppercase tracking-wide text-slate-400 dark:text-slate-400">K/D/A • CS</span>
        </div>
        <template x-if="state">
          <div class="space-y-2">
            <template x-for="player in state.team2.players" :key="player.id">
              <div class="flex items-center gap-3 rounded-lg border border-slate-100 dark:border-slate-700 p-2 bg-white/80 dark:bg-slate-700/60">
                <img
                  :src="player.champion.image_path || '/static/img/placeholders/champion_default.webp'"
                  :alt="player.champion.name"
                  class="h-10 w-10 rounded-lg object-cover"
                />
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold dark:text-white" x-text="player.name"></span>
                    <template x-if="player.role">
                      <span class="text-[10px] uppercase px-2 py-0.5 rounded-full bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-200" x-text="player.role"></span>
                    </template>
                  </div>
                  <div class="text-xs text-slate-500 dark:text-slate-300" x-text="player.champion.name"></div>
                </div>
                <div class="text-xs text-slate-500 dark:text-slate-200 text-right">
                  <div x-text="`${player.kills}/${player.deaths}/${player.assists}`"></div>
                  <div class="text-[10px]" x-text="`${player.farm} CS`"></div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
