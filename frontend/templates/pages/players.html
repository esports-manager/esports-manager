<div class="m-8" x-data="{
    playersActiveTab: $persist('players').using(sessionStorage),
    view: $persist('grid').using(sessionStorage),
    searchQuery: '',
    selectedTeam: '',
    selectedRegion: '',
    selectedRole: '',
    selectedStatus: '',
    sortBy: 'name',
    sortDirection: 'asc',
    metaTab: 'overview',
    perPage: '20',
    showFilters: false,
    updatePlayersList() {
      document.getElementById('per-page-input').value = this.perPage;
      // Trigger HTMX submit without native form navigation
      htmx.trigger('#player-filters-form', 'submit');
    }
  }">
  <!-- Page Header -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Players</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Browse players and performance metrics</p>
    </div>

    <!-- View Toggle -->
    <div class="flex items-center bg-gray-100 dark:bg-slate-700 rounded-lg p-1">
      <button @click="view = 'grid'" :class="{'bg-white dark:bg-slate-600 shadow': view === 'grid'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150">
        <i class="bi bi-grid mr-1"></i> Grid
      </button>
      <button @click="view = 'list'" :class="{'bg-white dark:bg-slate-600 shadow': view === 'list'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150">
        <i class="bi bi-list-ul mr-1"></i> List
      </button>
    </div>
  </div>

  <!-- Main Navigation Tabs -->
  <div class="mb-6 border-b border-gray-200 dark:border-gray-600">
    <div class="flex overflow-x-auto overflow-y-hidden">
      <button @click="playersActiveTab = 'players'"
        :class="{'border-blue-500 text-blue-600 dark:text-blue-400': playersActiveTab === 'players', 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300': playersActiveTab !== 'players'}"
        class="flex items-center h-14 px-4 -mb-px text-sm font-medium border-b-2 whitespace-nowrap focus:outline-none">
        <i class="bi bi-people mr-2"></i>
        Players
      </button>
      <button @click="playersActiveTab = 'meta'"
        :class="{'border-blue-500 text-blue-600 dark:text-blue-400': playersActiveTab === 'meta', 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300': playersActiveTab !== 'meta'}"
        class="flex items-center h-14 px-4 -mb-px text-sm font-medium border-b-2 whitespace-nowrap focus:outline-none">
        <i class="bi bi-bar-chart mr-2"></i>
        Performance
      </button>
    </div>
  </div>

  <!-- Player Performance Meta Section -->
  <div x-show="playersActiveTab === 'meta'" class="bg-white dark:bg-slate-700 rounded-lg shadow mb-6 overflow-hidden">
    <!-- We'll create this component later -->
    {% include "components/players_meta.html" %}
  </div>

  <div x-show="playersActiveTab === 'players'">
    <!-- Filters and Search -->
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-4 mb-6">
      <!-- Search & Filters Form -->
      <form id="player-filters-form" hx-get="/api/moba/players" hx-trigger="submit"
        hx-include="#player-filters-form" hx-swap="innerHTML" hx-target="#players-list">

        <!-- Search Bar (Full Width) with Filter Toggle -->
        <div class="relative w-full mb-3">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="bi bi-search text-gray-500 dark:text-gray-400"></i>
          </div>
          <input id="search-input" type="text" name="search" x-model="searchQuery" placeholder="Search players..."
            class="pl-10 pr-12 py-2 w-full rounded-lg bg-gray-100 dark:bg-slate-600 border-0 focus:ring-2 focus:ring-blue-500 text-sm shadow-sm"
            @input.debounce.300ms="$el.form.dispatchEvent(new Event('submit'))">

          <!-- Filter Toggle Button -->
          <button type="button" @click="showFilters = !showFilters"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 transition-colors">
            <i class="bi" :class="showFilters ? 'bi-funnel-fill' : 'bi-funnel'"></i>
            <span class="text-xs ml-1" x-text="showFilters ? 'Hide Filters' : 'Show Filters'"></span>
          </button>
        </div>

        <!-- Filter Dropdowns (Collapsible) -->
        <div x-show="showFilters" x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 transform -translate-y-2"
          x-transition:enter-end="opacity-100 transform translate-y-0">

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 mt-2">
            <!-- Team Filter -->
            <div class="col-span-1">
              <label for="team-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Team</label>
              <select id="team-filter" name="team_id" x-model="selectedTeam" x-ref="teamSelect" aria-label="Filter by team"
                @change="updatePlayersList()"
                hx-get="/api/moba/teams/options" hx-trigger="load" hx-target="#team-filter" hx-swap="beforeend"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="">All Teams</option>
              </select>
            </div>

            <!-- Region Filter -->
            <div class="col-span-1">
              <label for="region-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Region</label>
              <select id="region-filter" name="region" x-model="selectedRegion" @change="updatePlayersList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="">All Regions</option>
                <option value="eu">Europe</option>
                <option value="na">North America</option>
                <option value="kr">Korea</option>
                <option value="cn">China</option>
                <option value="other">Other</option>
              </select>
            </div>

            <!-- Role Filter -->
            <div class="col-span-1">
              <label for="role-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Role</label>
              <select id="role-filter" name="role" x-model="selectedRole" @change="updatePlayersList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="">All Roles</option>
                <option value="top">Top</option>
                <option value="jungle">Jungle</option>
                <option value="mid">Mid</option>
                <option value="adc">ADC</option>
                <option value="support">Support</option>
              </select>
            </div>

            <!-- Contract Status Filter -->
            <div class="col-span-1">
              <label for="status-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Status</label>
              <select id="status-filter" name="status" x-model="selectedStatus" @change="updatePlayersList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="">All Status</option>
                <option value="signed">Under Contract</option>
                <option value="free">Free Agent</option>
              </select>
            </div>

            <!-- Sort By -->
            <div class="col-span-1">
              <label for="sort-filter"
                class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-0.5 ml-1">Sort By</label>
              <select id="sort-filter" name="sort" x-model="sortBy" @change="updatePlayersList()"
                class="w-full bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-800 dark:text-gray-200 text-xs px-2 py-1.5 focus:ring-1 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="name">Name</option>
                <option value="role">Role</option>
                <option value="nationality">Nationality</option>
              </select>
            </div>
          </div>
        </div> <!-- End of collapsible filters section -->

        <!-- View Controls - Always Visible -->
        <div class="flex flex-wrap items-center justify-between mt-3 mb-1">
          <!-- Per page selector -->
          <div class="flex items-center">
            <label for="per-page-select" class="text-xs font-medium text-gray-600 dark:text-gray-400 mr-2">Per
              page:</label>
            <select id="per-page-select" x-model="perPage" @change="updatePlayersList()"
              class="text-xs bg-gray-100 dark:bg-slate-600 border-0 rounded-md text-gray-700 dark:text-gray-300 px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500 shadow-sm">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>

          <!-- Sort Direction & Hidden Input -->
          <div class="flex items-center">
            <label class="text-xs font-medium text-gray-600 dark:text-gray-400 mr-2">Order:</label>
            <button id="sort-direction-toggle"
              @click="sortDirection = sortDirection === 'asc' ? 'desc' : 'asc'; updatePlayersList();" type="button"
              class="text-xs bg-gray-100 hover:bg-gray-200 dark:bg-slate-600 dark:hover:bg-slate-500 rounded-md px-2 py-1 flex items-center justify-center shadow-sm">
              <i :class="sortDirection === 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'" class="mr-1"></i>
              <span x-text="sortDirection === 'asc' ? 'Asc' : 'Desc'"></span>
            </button>
          </div>

          <!-- Hidden inputs -->
          <input id="per-page-input" type="hidden" name="per_page" :value="perPage">
          <input type="hidden" name="direction" :value="sortDirection">
        </div>
      </form>

      <!-- Active Filters Display -->
      <div class="mt-3 flex flex-wrap gap-2"
        x-show="selectedTeam !== '' || selectedRegion !== '' || selectedRole !== '' || searchQuery !== ''">
        <span class="text-xs text-gray-500 dark:text-gray-400 self-center">Active filters:</span>

        <!-- Team Filter Tag -->
        <div x-show="selectedTeam !== ''"
          class="bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs px-2 py-1 rounded-full flex items-center">
          Team: <span x-text="$refs.teamSelect && $refs.teamSelect.selectedOptions.length ? $refs.teamSelect.selectedOptions[0].text : 'Selected'" class="font-medium mx-1"></span>
          <button @click="selectedTeam = ''" class="ml-1 hover:text-blue-600 dark:hover:text-blue-100">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Region Filter Tag -->
        <div x-show="selectedRegion !== ''"
          class="bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 text-xs px-2 py-1 rounded-full flex items-center">
          Region: <span x-text="selectedRegion.toUpperCase()" class="font-medium mx-1"></span>
          <button @click="selectedRegion = ''" class="ml-1 hover:text-green-600 dark:hover:text-green-100">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Role Filter Tag -->
        <div x-show="selectedRole !== ''"
          class="bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 text-xs px-2 py-1 rounded-full flex items-center">
          Role: <span x-text="selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1)"
            class="font-medium mx-1"></span>
          <button @click="selectedRole = ''" class="ml-1 hover:text-purple-600 dark:hover:text-purple-100">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Search Query Tag -->
        <div x-show="searchQuery !== ''"
          class="bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200 text-xs px-2 py-1 rounded-full flex items-center">
          Search: <span x-text="searchQuery" class="font-medium mx-1"></span>
          <button @click="searchQuery = ''" class="ml-1 hover:text-yellow-600 dark:hover:text-yellow-100">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Clear All Filters -->
        <button @click="selectedTeam = ''; selectedRegion = ''; selectedRole = ''; searchQuery = '';"
          class="text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 underline ml-2">
          Clear all
        </button>
      </div>
    </div>

    <div id="players-list" class="relative">
      {% include "components/players_skeleton.html" %}
    </div>
  </div>
</div>
