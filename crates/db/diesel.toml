# Diesel CLI configuration. `just db-schema` regenerates src/schema.rs from
# the migrations, and CI fails if the committed copy differs (ADR 0004).
[print_schema]
file = "src/schema.rs"
custom_type_derives = ["diesel::query_builder::QueryId", "Clone"]

[migrations_directory]
dir = "migrations"
