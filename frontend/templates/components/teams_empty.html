<!-- Empty State for Players List when no players match the filters -->
<div class="bg-white dark:bg-slate-700 rounded-lg shadow p-8 text-center">
  <div class="flex flex-col items-center justify-center py-6">
    <!-- Empty Illustration -->
    <div class="bg-gray-100 dark:bg-slate-600 rounded-full p-6 mb-4">
      <i class="bi bi-shield-fill text-4xl text-gray-400 dark:text-gray-500"></i>
    </div>

    <!-- Empty Message -->
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">No Teams Found</h3>
    <p class="text-gray-500 dark:text-gray-400 mb-6 max-w-md">
      {% if search_query %}
      No teams match your search for "{{ search_query }}". Try adjusting your filters or search terms.
      {% else %}
      No teams match your current filter criteria. Try adjusting your filters for different results.
      {% endif %}
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-3 justify-center">
      <!-- Reset Filters -->
      <button class="flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors"
        hx-get="/api/moba/teams" hx-include="#team-filters-form" hx-vals='{"reset": true}' hx-target="#teams-list"
        hx-swap="innerHTML">
        <i class="bi bi-arrow-repeat mr-2"></i>
        Reset Filters
      </button>
    </div>
  </div>
</div>
