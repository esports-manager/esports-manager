{% extends "base.html" %} {% block content %}
<div x-data="{expanded: $persist(true).using(sessionStorage)}">
  {% block sidebar %}{% include "components/sidebar.html" %}{% endblock %}

  <div class="flex flex-col w-full h-full">
    {% block navbar %}{% include "components/navbar.html" %}{% endblock %}

    <div
      class="transition-all"
      :class="{ 'ml-64': expanded, 'ml-16 sm:ml-20': !expanded }"
    >
      <div class="px-2">
        <div class="container mx-auto px-4" id="maincontent">
            {% block contentview %}
            {% include content %}
            {% endblock %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
