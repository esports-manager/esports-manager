<!-- Champions Skeleton/Loading State -->
<div id="champions-loading-skeleton" hx-get="/api/moba/champions" hx-trigger="load" hx-swap="innerHTML">
  <!-- Grid View Skeleton -->
  <div x-show="view === 'grid'" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
    {% for i in range(12) %}
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow overflow-hidden">
      <div class="relative">
        <div class="w-full h-28 bg-gray-200 dark:bg-slate-600 animate-pulse"></div>
      </div>
      <div class="p-3 space-y-2">
        <!-- Champion Role Skeleton -->
        <div class="flex justify-between">
          <div class="h-5 w-16 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
          <div class="h-5 w-16 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
        </div>
        
        <!-- Champion Type Skeleton -->
        <div class="flex justify-between">
          <div class="h-4 w-14 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
          <div class="h-4 w-14 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
        </div>
        
        <!-- Strength Bar Skeleton -->
        <div>
          <div class="flex items-center mb-1">
            <div class="h-4 w-14 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
            <div class="ml-auto h-4 w-6 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
          </div>
          <div class="h-1.5 bg-gray-200 dark:bg-slate-600 rounded-full animate-pulse"></div>
        </div>
        
        <!-- Difficulty Skeleton -->
        <div class="flex justify-between">
          <div class="h-4 w-14 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
          <div class="h-4 w-10 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- List View Skeleton -->
  <div x-show="view === 'list'" class="bg-white dark:bg-slate-700 rounded-lg shadow overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-600">
      <thead>
        <tr class="bg-gray-50 dark:bg-slate-800">
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
            Champion
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
            Role
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
            Type
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
            Strength
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
            Difficulty
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
            Tier
          </th>
        </tr>
      </thead>
      <tbody class="bg-white dark:bg-slate-700 divide-y divide-gray-200 dark:divide-gray-600">
        {% for i in range(6) %}
        <tr>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10 bg-gray-200 dark:bg-slate-600 rounded-full animate-pulse"></div>
              <div class="ml-4">
                <div class="h-4 w-20 bg-gray-200 dark:bg-slate-600 rounded animate-pulse mb-2"></div>
                <div class="h-3 w-24 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex flex-col gap-1">
              <div class="h-5 w-16 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
              <div class="h-5 w-16 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex flex-col gap-1">
              <div class="h-4 w-14 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
              <div class="h-4 w-14 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div>
              <div class="h-4 w-6 bg-gray-200 dark:bg-slate-600 rounded animate-pulse mb-1"></div>
              <div class="h-1.5 w-24 bg-gray-200 dark:bg-slate-600 rounded-full animate-pulse"></div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="h-4 w-12 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="h-6 w-8 bg-gray-200 dark:bg-slate-600 rounded animate-pulse"></div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
