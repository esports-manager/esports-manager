<!DOCTYPE html>
<html lang="en" x-data="{
    darkMode: $persist(localStorage.getItem('darkMode')
      ? JSON.parse(localStorage.getItem('darkMode'))
      : window.matchMedia('(prefers-color-scheme: dark)').matches).using(sessionStorage),
  }" x-init="$watch('darkMode', value => document.documentElement.classList.toggle('dark', value))"
  :class="{ 'dark' : darkMode }">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>eSports Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='img/icons/bootstrap-icons.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/flag-icons.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='img/trophy.svg') }}" />
  <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
  <script defer src="{{ url_for('static', path='js/alpine.persist.min.js') }}"></script>
  <script defer src="{{ url_for('static', path='js/alpine.min.js') }}"></script>
  <script>
    window.continueActionState = {
      label: "Continue",
      href: "",
      enabled: false,
      tooltip: "Complete the current step to continue.",
      onClick: "",
    };

    window.setContinueAction = function (action) {
      window.continueActionState = {
        ...window.continueActionState,
        ...action,
      };
      if (document.readyState === "loading") {
        return;
      }
      if (typeof window.applyContinueAction === "function") {
        window.applyContinueAction();
      }
    };

    window.resetContinueAction = function () {
      window.setContinueAction({
        label: "Continue",
        href: "",
        enabled: false,
        tooltip: "Complete the current step to continue.",
        onClick: "",
      });
    };

    window.sessionState = {
      data: null,
      status: "idle",
    };

    window.resolveSessionId = function () {
      const params = new URLSearchParams(window.location.search);
      const urlSessionId = params.get("session_id");
      if (urlSessionId) {
        localStorage.setItem("activeSessionId", urlSessionId);
        return urlSessionId;
      }
      return localStorage.getItem("activeSessionId");
    };

    window.getTeamInitials = function (name) {
      if (!name) {
        return "TEAM";
      }
      const words = name.split(" ").filter(Boolean);
      if (words.length === 1) {
        return words[0].slice(0, 3).toUpperCase();
      }
      return words
        .slice(0, 3)
        .map((word) => word[0])
        .join("")
        .toUpperCase();
    };

    window.applySessionBindings = function (session) {
      document.querySelectorAll("[data-session-team-name]").forEach((el) => {
        const fallback = el.dataset.sessionDefault || "Your Team";
        el.textContent = session?.team_name || fallback;
      });

      document.querySelectorAll("[data-session-manager-name]").forEach((el) => {
        const fallback = el.dataset.sessionDefault || "Manager";
        el.textContent = session?.manager_display_name || fallback;
      });

      document.querySelectorAll("[data-session-save-name]").forEach((el) => {
        const fallback = el.dataset.sessionDefault || "Active save";
        el.textContent = session?.name || fallback;
      });

      document.querySelectorAll("[data-session-current-day]").forEach((el) => {
        if (session?.current_day !== undefined && session?.current_day !== null) {
          el.textContent = session.current_day;
        }
      });

      document.querySelectorAll("[data-session-team-short]").forEach((el) => {
        const fallback = el.dataset.sessionDefault || "TEAM";
        const shortName = session?.team_name
          ? window.getTeamInitials(session.team_name)
          : fallback;
        el.textContent = shortName;
      });

      document.querySelectorAll("[data-session-team-logo]").forEach((img) => {
        const fallback = img.dataset.sessionTeamFallback || img.src;
        if (session?.team_logo_url) {
          img.src = session.team_logo_url;
          return;
        }
        if (fallback) {
          img.src = fallback;
        }
      });
    };

    window.updateSaveButton = function (enabled) {
      const saveButton = document.getElementById("session-save-button");
      if (!saveButton) {
        return;
      }
      saveButton.disabled = !enabled;
      saveButton.classList.toggle("opacity-60", !enabled);
      saveButton.classList.toggle("cursor-not-allowed", !enabled);
    };

    window.setSessionMissing = function () {
      window.sessionState = { data: null, status: "missing" };
      window.applySessionBindings(null);
      window.updateSaveButton(false);
      document.dispatchEvent(new CustomEvent("session:missing"));
    };

    window.setSessionActive = function (session) {
      window.sessionState = { data: session, status: "ready" };
      window.applySessionBindings(session);
      window.updateSaveButton(true);
      document.dispatchEvent(new CustomEvent("session:updated", { detail: session }));
    };

    window.loadActiveSession = async function () {
      const sessionId = window.resolveSessionId();
      if (!sessionId) {
        window.setSessionMissing();
        return null;
      }
      try {
        const response = await fetch(`/api/moba/sessions/${sessionId}`);
        if (!response.ok) {
          throw new Error("Session not found");
        }
        const data = await response.json();
        window.setSessionActive(data);
        return data;
      } catch (error) {
        localStorage.removeItem("activeSessionId");
        window.setSessionMissing();
        return null;
      }
    };

    window.lineupBoard = function ({
      blueTeamId,
      redTeamId,
      blueEditable,
      redEditable,
      matchId,
      lineupReady,
    }) {
      return {
        dragging: null,
        dragTarget: null,
        alertMessage: "",
        matchId: matchId,
        lineupReady: lineupReady,
        updateContinueAction() {
          const ready = this.lineupReady === true;
          const resolvedMatchId =
            this.matchId || document.getElementById("lineup-container")?.dataset.matchId;
          if (window.setContinueAction && resolvedMatchId) {
            window.setContinueAction({
              label: "Champion Selection",
              href: `/api/moba/draft/match/${resolvedMatchId}`,
              enabled: ready,
              tooltip: ready ? "" : "Confirm both lineups to continue.",
            });
          }
        },
        startDrag(payload, event) {
          this.dragging = payload;
          this.dragTarget = null;
          if (event && event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", payload.label || "player");
          }
        },
        clearError() {
          this.alertMessage = "";
        },
        handleError(event) {
          const xhr = event && event.detail ? event.detail.xhr : null;
          if (!xhr) {
            return;
          }
          let message = "Unable to complete that action.";
          try {
            const data = JSON.parse(xhr.responseText);
            if (data && data.detail) {
              message = data.detail;
            }
          } catch (error) {
            if (xhr.responseText) {
              message = xhr.responseText;
            }
          }
          this.alertMessage = message;
        },
        canEdit(teamId) {
          if (teamId === blueTeamId && !blueEditable) {
            this.alertMessage = "Blue lineup is locked.";
            return false;
          }
          if (teamId === redTeamId && !redEditable) {
            this.alertMessage = "Red lineup is locked.";
            return false;
          }
          return true;
        },
        ensureTeam(teamId) {
          if (!this.dragging) {
            return false;
          }
          if (this.dragging.teamId !== teamId) {
            this.alertMessage = "You can only move players within the same team.";
            return false;
          }
          return true;
        },
        dropOnSlot(slotId, slotRole, teamId) {
          if (!this.ensureTeam(teamId) || !this.canEdit(teamId)) {
            this.dragTarget = null;
            return;
          }
          this.clearError();
          const payload = {
            player_id: this.dragging.playerId || "",
            assigned_role: slotRole,
          };
          if (this.dragging.fromSlotId) {
            payload.from_slot_id = this.dragging.fromSlotId;
          }
          this.dragTarget = null;
          htmx.ajax("POST", `/api/moba/lineup/slot/${slotId}/assign`, {
            target: "#lineup-container",
            swap: "outerHTML",
            values: payload,
          });
        },
        dropOnBench(teamId) {
          if (!this.ensureTeam(teamId) || !this.canEdit(teamId)) {
            this.dragTarget = null;
            return;
          }
          if (!this.dragging.fromSlotId) {
            this.alertMessage = "This player is already on the bench.";
            return;
          }
          this.clearError();
          const payload = {
            player_id: "",
            assigned_role: this.dragging.slotRole,
            from_slot_id: this.dragging.fromSlotId,
          };
          this.dragTarget = null;
          htmx.ajax(
            "POST",
            `/api/moba/lineup/slot/${this.dragging.fromSlotId}/assign`,
            {
              target: "#lineup-container",
              swap: "outerHTML",
              values: payload,
            }
          );
        },
        clearSlot(slotId, slotRole, teamId) {
          this.dragging = {
            playerId: null,
            teamId: teamId,
            fromSlotId: slotId,
            slotRole: slotRole,
            label: "",
          };
          this.dropOnBench(teamId);
        },
      };
    };

    document.addEventListener("continue:update", (event) => {
      if (event.detail) {
        window.setContinueAction(event.detail);
      }
    });

    document.addEventListener("htmx:afterSwap", (event) => {
      if (window.Alpine && event.detail && event.detail.target) {
        window.Alpine.initTree(event.detail.target);
      }
      if (typeof window.applyContinueAction === "function") {
        window.applyContinueAction();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof window.applyContinueAction === "function") {
        window.applyContinueAction();
      }
      if (typeof window.loadActiveSession === "function") {
        window.loadActiveSession();
      }
    });
  </script>
</head>

<body class="bg-gray-100 dark:bg-slate-800 dark:text-white">
  {% block content %}{% endblock %}
</body>

</html>
