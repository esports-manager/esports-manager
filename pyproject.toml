[project]
name = "esports-manager"
version = "0.1.0"
description = "A free and open source eSports manager game"
authors = ["sturdy-robot <admin@esportsmanager.net>"]
license = "GPLv3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.41",
    "pywebview[qt]>=5.4",
    "jinja2>=3.1.6",
    "pytailwindcss>=0.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.11",
]
