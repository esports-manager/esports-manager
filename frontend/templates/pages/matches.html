<!-- New Match Management Page -->
{% set session_query = '?session_id=' ~ session_id if session_id else '' %}
<div
  class="m-8"
  x-data="{ showCreateModal: false, blueTeamId: '', redTeamId: '' }"
>
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Match Management</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Create and manage matches with the new lineup → draft → simulation flow</p>
    </div>
    <button
      type="button"
      @click="showCreateModal = true"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center gap-2"
    >
      <i class="bi bi-plus-circle"></i>
      Create New Match
    </button>
  </div>

  <!-- Create Match Modal -->
  <div
    x-show="showCreateModal"
    x-cloak
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    @click.self="showCreateModal = false"
  >
    <div
      class="bg-white dark:bg-slate-700 rounded-lg p-6 max-w-md w-full mx-4"
      @click.stop
    >
      <h2 class="text-xl font-bold mb-4 dark:text-white">Create New Match</h2>

      <form
        class="space-y-4"
        hx-post="/api/moba/match/create{{ session_query }}"
        hx-target="#match-create-error"
        hx-swap="innerHTML"
      >
        <div>
          <label class="block text-sm font-medium mb-2 dark:text-white">Blue Team</label>
          <select
            x-model="blueTeamId"
            name="blue_team_id"
            class="w-full rounded border dark:bg-slate-800 dark:border-slate-600 px-3 py-2"
            required
            hx-get="/api/moba/teams/options{{ session_query }}"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"
          >
            <option value="">Loading teams...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 dark:text-white">Red Team</label>
          <select
            x-model="redTeamId"
            name="red_team_id"
            class="w-full rounded border dark:bg-slate-800 dark:border-slate-600 px-3 py-2"
            required
            hx-get="/api/moba/teams/options{{ session_query }}"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"
          >
            <option value="">Loading teams...</option>
          </select>
        </div>

        <p id="match-create-error" class="text-sm text-red-600"></p>

        <div class="flex gap-3 pt-4">
          <button
            type="submit"
            :disabled="!blueTeamId || !redTeamId || blueTeamId === redTeamId"
            class="flex-1 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded disabled:opacity-50"
          >
            Create Match
          </button>
          <button
            type="button"
            @click="showCreateModal = false"
            class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Matches List -->
  <div
    id="matches-list"
    hx-get="/api/moba/match/list{{ session_query }}"
    hx-trigger="load"
    hx-target="this"
    hx-swap="innerHTML"
    class="grid gap-4"
  >
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-12 text-center">
      <i class="bi bi-arrow-repeat text-4xl text-gray-300 dark:text-gray-600 mb-4"></i>
      <p class="text-gray-500 dark:text-gray-400">Loading matches...</p>
    </div>
  </div>
</div>

<style>
[x-cloak] { display: none !important; }
</style>
