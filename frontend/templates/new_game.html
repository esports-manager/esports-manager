<!DOCTYPE html>
<html lang="en" x-data="{
    darkMode: $persist(localStorage.getItem('darkMode')
      ? JSON.parse(localStorage.getItem('darkMode'))
      : window.matchMedia('(prefers-color-scheme: dark)').matches).using(sessionStorage),
  }" x-init="$watch('darkMode', value => document.documentElement.classList.toggle('dark', value))"
  :class="{ 'dark' : darkMode }">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>eSports Manager - New Game</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='img/icons/bootstrap-icons.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/imgblur.css') }}" />
  <script defer src="{{ url_for('static', path='js/alpine.persist.min.js') }}"></script>
  <script defer src="{{ url_for('static', path='js/alpine.min.js') }}"></script>

</head>

<body class="text-white">
  <div class="bg-blur"></div>

  <button type="button" @click="darkMode = !darkMode"
    class="fixed z-20 top-4 right-4 rounded-full px-4 py-3 bg-slate-200/90 text-slate-700 hover:bg-slate-100 dark:bg-slate-700 dark:text-slate-100 dark:hover:bg-slate-600"
    aria-label="Toggle dark mode">
    <span x-show="darkMode !== true">
      <i class="bi bi-moon-fill text-lg"></i>
    </span>
    <span x-show="darkMode === true">
      <i class="bi bi-sun-fill text-lg"></i>
    </span>
  </button>

  <div class="relative min-h-screen flex flex-col items-center justify-center px-6 py-12">
    <div class="flex flex-col items-center gap-4 mb-8">
      <img id="logo" class="w-20 h-20" src="{{ url_for('static', path='img/trophy.svg') }}" alt="eSports Manager" />
      <div class="text-center">
        <h1 class="text-3xl font-semibold">Start a New Career</h1>
        <p class="text-sm text-white/70">
          Define your manager profile and pick the team you want to lead.
        </p>
      </div>
    </div>

    <div
      class="w-full max-w-2xl bg-slate-100/80 text-slate-900 dark:bg-slate-900/80 dark:text-slate-100 rounded-2xl shadow-2xl p-8 backdrop-blur">

      <div class="relative flex items-center justify-center mb-6">
        <a href="/"
          class="absolute left-0 text-sm font-semibold bg-slate-200 hover:bg-slate-100 dark:bg-slate-800 dark:text-blue-200 border border-slate-200 dark:border-slate-700 dark:hover:bg-slate-700 px-3 py-2 rounded-full text-blue-600 hover:text-blue-500"><i
            class="bi bi-arrow-left"></i></a>
        <div class="flex flex-col text-center px-8">
          <h2 class="text-xl font-semibold">New Game Setup</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">Configure your manager profile.</p>

        </div>
      </div>

      <form id="new-game-form" class="space-y-5">
        <div class="rounded-2xl bg-slate-50 border border-slate-200/80 dark:bg-slate-800 dark:border-slate-700 p-5">

          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-700 dark:text-slate-200">

                Manager profile
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">

                These details appear across your career dashboard.
              </p>
            </div>
            <span class="text-xs text-slate-400 dark:text-slate-500">Required</span>

          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <label for="manager-first-name" class="text-sm font-semibold text-slate-700 dark:text-slate-200">First
                name</label>
              <input id="manager-first-name" name="manager_first_name" type="text" placeholder="e.g. Jordan"
                class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500"
                required />

            </div>
            <div>
              <label for="manager-last-name" class="text-sm font-semibold text-slate-700 dark:text-slate-200">Last
                name</label>
              <input id="manager-last-name" name="manager_last_name" type="text" placeholder="e.g. Silva"
                class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500"
                required />

            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <label for="manager-nickname"
                class="text-sm font-semibold text-slate-700 dark:text-slate-200">Nickname</label>
              <input id="manager-nickname" name="manager_nickname" type="text" placeholder="Optional handle"
                class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500" />

            </div>
            <div>
              <label for="manager-nationality"
                class="text-sm font-semibold text-slate-700 dark:text-slate-200">Nationality</label>
              <input id="manager-nationality" name="manager_nationality" type="text" placeholder="Optional"
                class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500" />

            </div>
          </div>
          <div class="mt-4">
            <label for="manager-birthdate"
              class="text-sm font-semibold text-slate-700 dark:text-slate-200">Birthday</label>
            <input id="manager-birthdate" name="manager_birthdate" type="date"
              class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100" />
          </div>
        </div>

        <div>
          <label for="save-name" class="text-sm font-semibold text-slate-700 dark:text-slate-200">Save name
            (optional)</label>
          <input id="save-name" name="name" type="text" placeholder="My first season"
            class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500" />

        </div>

        <div>
          <label for="team-select" class="text-sm font-semibold text-slate-700 dark:text-slate-200">Choose your
            team</label>
          <select id="team-select" name="team_id"
            class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100"
            required>

            <option value="">Loading teams...</option>
          </select>

        </div>

        <div class="grid grid-cols-1 gap-4">
          <div class="flex flex-col justify-center">
            <details class="rounded-xl bg-slate-100 dark:bg-slate-900 px-4 py-3 grid">
              <summary class="cursor-pointer text-sm font-semibold text-slate-700 dark:text-slate-200">
                Advanced database settings
              </summary>
              <div
                class="grid-cols-1 md:grid-cols-2 gap-4 mt-4 bg-slate-50 dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
                <div>
                  <label for="base-db" class="text-sm font-semibold text-slate-700 dark:text-slate-200">Base database
                    URL (optional)</label>
                  <input id="base-db" name="base_database_url" type="text"
                    placeholder="sqlite+aiosqlite:///path/to/app.db"
                    class="mt-3 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500" />
                </div>
                <div class="flex flex-col">
                  <label for="seed"
                    class="mt-4 text-sm font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1">
                    Seed (optional)
                    <span class="relative group inline-flex items-center">
                      <i class="bi bi-question-circle text-slate-400 dark:text-slate-500"></i>
                      <span
                        class="pointer-events-none absolute left-2 top-full z-10 mt-2 w-72 -translate-x-2 rounded-lg bg-black px-3 py-2 text-xs text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100">
                        Use a seed to reproduce the same season generation.
                      </span>
                    </span>
                  </label>
                  <input id="seed" name="seed" type="number" min="0" placeholder="0"
                    class="mt-2 w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500" />
                </div>
              </div>
            </details>

          </div>
        </div>

        <p id="new-game-error" class="text-sm text-red-600"></p>

        <div class="flex items-center justify-between gap-3">
          <a href="/load_game"
            class="text-sm font-semibold text-blue-500 hover:text-blue-400 dark:text-blue-400 dark:hover:text-blue-300">Already
            have a save?</a>

          <button id="new-game-submit" type="submit"
            class="px-6 py-3 rounded-xl cursor-pointer text-white bg-blue-500 hover:bg-blue-400 text-lg font-semibold shadow">
            Create save
          </button>
        </div>
        <p id="new-game-loading" class="text-xs text-slate-500 dark:text-slate-400 hidden">
          Creating session...
        </p>

      </form>
    </div>
  </div>

  <script>
    const teamSelect = document.getElementById("team-select");
    const form = document.getElementById("new-game-form");
    const errorEl = document.getElementById("new-game-error");
    const submitBtn = document.getElementById("new-game-submit");
    const loadingEl = document.getElementById("new-game-loading");

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.classList.toggle("opacity-60", isLoading);
      submitBtn.classList.toggle("cursor-not-allowed", isLoading);
      loadingEl.classList.toggle("hidden", !isLoading);
    }

    async function loadTeams() {
      try {
        const response = await fetch("/api/moba/teams/options");
        if (!response.ok) {
          throw new Error("Unable to load teams.");
        }
        const teams = await response.json();
        teamSelect.innerHTML = "<option value=\"\">Select a team</option>";
        teams.forEach((team) => {
          const option = document.createElement("option");
          option.value = team.id;
          option.textContent = team.name;
          teamSelect.appendChild(option);
        });
      } catch (error) {
        teamSelect.innerHTML = "<option value=\"\">No teams available</option>";
        errorEl.textContent = error.message;
      }
    }

    async function submitNewGame(event) {
      event.preventDefault();
      errorEl.textContent = "";

      const managerFirstName = document
        .getElementById("manager-first-name")
        .value.trim();
      const managerLastName = document
        .getElementById("manager-last-name")
        .value.trim();
      const managerNickname = document
        .getElementById("manager-nickname")
        .value.trim();
      const managerNationality = document
        .getElementById("manager-nationality")
        .value.trim();
      const managerBirthdate = document
        .getElementById("manager-birthdate")
        .value;
      const teamId = Number(teamSelect.value || 0);
      const saveName = document.getElementById("save-name").value.trim();
      const seedValue = document.getElementById("seed").value;
      const baseDb = document.getElementById("base-db").value.trim();

      if (!managerFirstName || !managerLastName) {
        errorEl.textContent = "First and last name are required.";
        return;
      }
      if (!teamId) {
        errorEl.textContent = "Please select a team.";
        return;
      }

      const payload = {
        manager_first_name: managerFirstName,
        manager_last_name: managerLastName,
        team_id: teamId,
      };
      if (managerNickname) payload.manager_nickname = managerNickname;
      if (managerNationality) payload.manager_nationality = managerNationality;
      if (managerBirthdate) payload.manager_birthdate = managerBirthdate;
      if (saveName) payload.name = saveName;
      if (seedValue) payload.seed = Number(seedValue);
      if (baseDb) payload.base_database_url = baseDb;

      setLoading(true);
      try {
        const response = await fetch("/api/moba/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.detail || "Unable to create a new save.");
        }
        localStorage.setItem("activeSessionId", String(data.id));
        window.location.href = `/home?session_id=${data.id}`;
      } catch (error) {
        errorEl.textContent = error.message;
      } finally {
        setLoading(false);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadTeams();
      form.addEventListener("submit", submitNewGame);
    });
  </script>
</body>

</html>
