<div class="m-8" x-data="lineupsPage()" x-init="init()">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Lineup Selection</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Pick your teams, set starting players per role, assign champions, then start the simulation.</p>
    </div>
    <div class="flex items-center gap-3">
      <div>
        <label class="block text-xs mb-1">Team 1</label>
        <select class="rounded border dark:bg-slate-800" x-model.number="team1Id" @change="onTeamChange('team1')">
          <option value="">-- choose --</option>
          <template x-for="t in teams" :key="'t1-'+t.id">
            <option :value="t.id" x-text="t.name"></option>
          </template>
        </select>
      </div>
      <div>
        <label class="block text-xs mb-1">Team 2</label>
        <select class="rounded border dark:bg-slate-800" x-model.number="team2Id" @change="onTeamChange('team2')">
          <option value="">-- choose --</option>
          <template x-for="t in teams" :key="'t2-'+t.id">
            <option :value="t.id" x-text="t.name"></option>
          </template>
        </select>
      </div>
      <button class="ml-auto px-3 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white disabled:opacity-50" :disabled="!canSubmit()" @click="submitAndGo()">Create Simulation</button>
    </div>
  </div>

  <!-- Three column layout -->
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
    <!-- Team 1 side -->
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-4">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
        <h2 class="text-lg font-semibold">Team 1</h2>
      </div>
      <template x-if="team1Id">
        <div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="role in roles" :key="'t1-role-'+role">
              <div class="p-3 rounded border border-dashed dark:border-slate-600 min-h-[72px]"
                   :class="[isSelected('team1', role) ? 'ring-2 ring-blue-500' : '', draggingChampion && roster.team1[role] ? 'ring-2 ring-amber-400' : '']"
                   @click="selectSlot('team1', role)"
                   @dragover.prevent
                   @drop="onDropPlayer($event, 'team1', role)"
              >
                <div class="text-xs uppercase text-gray-500 mb-1"><span class="capitalize" x-text="role"></span></div>
                <template x-if="roster.team1[role]">
                  <div>
                    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800 px-2 py-1 rounded"
                         draggable="true"
                         @dragstart="onDragPlayer($event, 'team1', role); draggingChampion=false"
                         @dragend="onDragEnd()">
                      <div class="truncate">
                        <span class="text-sm font-medium" x-text="displayPlayerById(roster.team1[role])"></span>
                      </div>
                    </div>
                    <!-- Champion assignment drop target -->
                    <div class="mt-2 px-2 py-1 rounded border border-dashed dark:border-slate-600"
                         :class="assignments.team1[role] ? 'bg-slate-50 dark:bg-slate-800' : (draggingChampion ? 'bg-amber-50 dark:bg-amber-900/20 border-amber-400' : 'bg-slate-50 dark:bg-slate-800')"
                         @dragover.prevent
                         @drop="onDropPlayer($event, 'team1', role)"
                         @click="selectSlot('team1', role)">
                      <template x-if="assignments.team1[role]">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-2">
                            <i class="bi bi-shield text-slate-500"></i>
                            <span class="text-xs" x-text="displayChampion(assignments.team1[role])"></span>
                          </div>
                          <div class="text-[10px] text-gray-500 cursor-move"
                               draggable="true"
                               @dragstart="onDragAssigned($event, 'team1', role)"
                               @dragend="onDragEnd()">
                            Move
                          </div>
                        </div>
                      </template>
                      <template x-if="!assignments.team1[role]">
                        <div class="text-xs text-gray-400">Drop champion here</div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!roster.team1[role]">
                  <div class="text-xs text-gray-400">Drop a player here</div>
                </template>
              </div>
            </template>
          </div>

          <!-- Reserves -->
          <div class="mt-4">
            <div class="text-sm font-medium mb-2">Reserves</div>
            <div class="min-h-[64px] rounded border border-dashed dark:border-slate-600 p-2 flex flex-wrap gap-2"
                 @dragover.prevent
                 @drop="onDropToReserves($event, 'team1')">
              <template x-for="p in reserves.team1" :key="'t1-res-'+p.id">
                <div class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 cursor-move"
                     draggable="true"
                     @dragstart="onDragReserve($event, 'team1', p.id)"
                     @click="selectById('team1', p.id)">
                  <span class="text-xs" x-text="displayPlayer(p)"></span>
                </div>
              </template>
              <div class="text-xs text-gray-400" x-show="reserves.team1.length === 0">No reserves</div>
            </div>
          </div>
        </div>
      </template>
      <template x-if="!team1Id">
        <div class="text-sm text-gray-500">Choose a team to load players.</div>
      </template>
    </div>

    <!-- Center: Champions -->
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-4">
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <h2 class="text-lg font-semibold mr-auto">Champions</h2>
        <select class="rounded border dark:bg-slate-800 text-sm" x-model="roleFilter">
          <option value="">All roles</option>
          <template x-for="r in roles" :key="'rf-'+r">
            <option :value="r" x-text="r"></option>
          </template>
        </select>
        <input type="text" class="rounded border dark:bg-slate-800 text-sm px-2 py-1" placeholder="Search..." x-model="search" />
      </div>
      <div class="text-xs text-gray-500 mb-2" x-show="!selected.team">Select a player slot to tailor this list to their champion pool.</div>
      <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-2">
        <template x-for="c in visibleChamps()" :key="'c-'+c.id">
          <div class="p-2 rounded bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 cursor-pointer"
               draggable="true"
               @dragstart="onDragChampion($event, c.id)"
               @click="assignToSelected(c.id)">
            <div class="text-sm font-medium truncate" x-text="c.name"></div>
            <div class="text-[10px] text-gray-500 flex justify-between">
              <span class="capitalize" x-text="c.primary_role"></span>
              <span>STR <span x-text="c.strength"></span></span>
            </div>
            <div class="text-[10px] mt-1" x-show="selected.team">
              <template x-if="poolInfoFor(c.id)">
                <span class="text-emerald-500">Pool: <span x-text="poolInfoFor(c.id).tier"></span> • <span x-text="poolInfoFor(c.id).points"></span> pts</span>
              </template>
              <template x-if="!poolInfoFor(c.id)">
                <span class="text-gray-400">Outside pool</span>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Team 2 side -->
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow p-4">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-2 h-2 rounded-full bg-rose-500"></div>
        <h2 class="text-lg font-semibold">Team 2</h2>
      </div>
      <template x-if="team2Id">
        <div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <template x-for="role in roles" :key="'t2-role-'+role">
              <div class="p-3 rounded border border-dashed dark:border-slate-600 min-h-[72px]"
                   :class="[isSelected('team2', role) ? 'ring-2 ring-rose-500' : '', draggingChampion && roster.team2[role] ? 'ring-2 ring-amber-400' : '']"
                   @click="selectSlot('team2', role)"
                   @dragover.prevent
                   @drop="onDropPlayer($event, 'team2', role)">
                <div class="text-xs uppercase text-gray-500 mb-1"><span class="capitalize" x-text="role"></span></div>
                <template x-if="roster.team2[role]">
                  <div>
                    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800 px-2 py-1 rounded"
                         draggable="true"
                         @dragstart="onDragPlayer($event, 'team2', role); draggingChampion=false"
                         @dragend="onDragEnd()">
                      <div class="truncate">
                        <span class="text-sm font-medium" x-text="displayPlayerById(roster.team2[role])"></span>
                      </div>
                    </div>
                    <!-- Champion assignment drop target -->
                    <div class="mt-2 px-2 py-1 rounded border border-dashed dark:border-slate-600"
                         :class="assignments.team2[role] ? 'bg-slate-50 dark:bg-slate-800' : (draggingChampion ? 'bg-amber-50 dark:bg-amber-900/20 border-amber-400' : 'bg-slate-50 dark:bg-slate-800')"
                         @dragover.prevent
                         @drop="onDropPlayer($event, 'team2', role)"
                         @click="selectSlot('team2', role)">
                      <template x-if="assignments.team2[role]">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-2">
                            <i class="bi bi-shield text-slate-500"></i>
                            <span class="text-xs" x-text="displayChampion(assignments.team2[role])"></span>
                          </div>
                          <div class="text-[10px] text-gray-500 cursor-move"
                               draggable="true"
                               @dragstart="onDragAssigned($event, 'team2', role)"
                               @dragend="onDragEnd()">
                            Move
                          </div>
                        </div>
                      </template>
                      <template x-if="!assignments.team2[role]">
                        <div class="text-xs text-gray-400">Drop champion here</div>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!roster.team2[role]">
                  <div class="text-xs text-gray-400">Drop a player here</div>
                </template>
              </div>
            </template>
          </div>

          <!-- Reserves -->
          <div class="mt-4">
            <div class="text-sm font-medium mb-2">Reserves</div>
            <div class="min-h-[64px] rounded border border-dashed dark:border-slate-600 p-2 flex flex-wrap gap-2"
                 @dragover.prevent
                 @drop="onDropToReserves($event, 'team2')">
              <template x-for="p in reserves.team2" :key="'t2-res-'+p.id">
                <div class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 cursor-move"
                     draggable="true"
                     @dragstart="onDragReserve($event, 'team2', p.id)"
                     @click="selectById('team2', p.id)">
                  <span class="text-xs" x-text="displayPlayer(p)"></span>
                </div>
              </template>
              <div class="text-xs text-gray-400" x-show="reserves.team2.length === 0">No reserves</div>
            </div>
          </div>
        </div>
      </template>
      <template x-if="!team2Id">
        <div class="text-sm text-gray-500">Choose a team to load players.</div>
      </template>
    </div>
  </div>

  <p class="text-sm text-red-300 mt-4" x-show="error" x-text="error"></p>

  <script>
    function lineupsPage() {
      return {
        roles: ['top','jungle','mid','adc','support'],
        teams: [],
        team1Id: '',
        team2Id: '',
        teamPlayers: { team1: [], team2: [] },
        roster: { team1: { top: null, jungle: null, mid: null, adc: null, support: null }, team2: { top: null, jungle: null, mid: null, adc: null, support: null } },
        reserves: { team1: [], team2: [] },
        assignments: { team1: { top: null, jungle: null, mid: null, adc: null, support: null }, team2: { top: null, jungle: null, mid: null, adc: null, support: null } },
        champions: [],
        selected: { team: '', role: '' },
        draggingChampion: false,
        playerPools: {}, // playerId -> { [championId]: { tier, points } }
        roleFilter: '',
        search: '',
        error: '',
        init() {
          this.fetchTeams();
          this.fetchChampions();
        },
        api(path) { return `/api/moba${path}`; },
        async fetchTeams() {
          try {
            const res = await fetch(this.api('/teams/options'));
            this.teams = await res.json();
          } catch (e) { this.error = 'Failed to load teams'; console.error(e); }
        },
        async onTeamChange(which) {
          const id = which === 'team1' ? this.team1Id : this.team2Id;
          if (!id) { this.teamPlayers[which] = []; this.clearTeam(which); return; }
          try {
            const res = await fetch(this.api(`/teams/${id}/players`));
            const players = await res.json();
            this.teamPlayers[which] = players;
            this.seedRoster(which);
          } catch (e) { this.error = `Failed to load players for ${which}`; console.error(e); }
        },
        clearTeam(which) {
          this.roles.forEach(r => { this.roster[which][r] = null; this.assignments[which][r] = null; });
          this.reserves[which] = [];
        },
        seedRoster(which) {
          // pick first player of each role as starter, rest as reserves
          const starters = {};
          const res = [];
          for (const r of this.roles) starters[r] = null;
          for (const p of this.teamPlayers[which]) {
            const role = (p.role || '').toLowerCase();
            if (this.roles.includes(role) && !starters[role]) { starters[role] = p.id; }
            else { res.push(p); }
          }
          this.roles.forEach(r => this.roster[which][r] = starters[r]);
          this.reserves[which] = res;
        },
        displayPlayer(p) {
          const name = p.nick_name || `${p.first_name} ${p.last_name}`;
          const role = p.role || '';
          return `${name}${role ? ' • '+role : ''}`;
        },
        displayPlayerById(playerId) {
          if (!playerId) return '';
          const t = this.findPlayerTeam(playerId);
          const p = this.teamPlayers[t].find(x => x.id === playerId);
          return p ? this.displayPlayer(p) : `#${playerId}`;
        },
        findPlayerTeam(playerId) {
          if (this.teamPlayers.team1.some(p=>p.id===playerId)) return 'team1';
          return 'team2';
        },
        selectSlot(team, role) {
          this.selected = { team, role };
          const pid = this.roster[team][role];
          if (pid) this.ensurePoolLoaded(pid);
        },
        selectById(team, playerId) {
          // select the matching role slot if on roster, else just set selection
          const role = this.roles.find(r => this.roster[team][r] === playerId) || '';
          this.selected = { team, role };
          this.ensurePoolLoaded(playerId);
        },
        async ensurePoolLoaded(playerId) {
          if (this.playerPools[playerId]) return;
          try {
            const res = await fetch(this.api(`/players/${playerId}/champion_pool`));
            const data = await res.json();
            const map = {};
            for (const it of data) { map[it.champion_id] = { tier: it.tier, points: it.points }; }
            this.playerPools[playerId] = map;
          } catch(e) { console.warn('pool load failed', e); }
        },
        poolInfoFor(championId) {
          const pid = this.currentPlayerId();
          if (!pid) return null;
          const pool = this.playerPools[pid] || {};
          return pool[championId] || null;
        },
        currentPlayerId() {
          if (!this.selected.team) return null;
          return this.roster[this.selected.team][this.selected.role];
        },
        async fetchChampions() {
          try {
            const res = await fetch(this.api(`/champions?per_page=200`));
            this.champions = await res.json();
          } catch (e) { console.error('Failed to load champions', e); }
        },
        visibleChamps() {
          const q = (this.search || '').toLowerCase().trim();
          const rf = (this.roleFilter || '').toLowerCase();
          let list = this.champions;
          if (rf) list = list.filter(c => (c.primary_role || '').toLowerCase() === rf);
          if (q) list = list.filter(c => (c.name || '').toLowerCase().includes(q));
          const pid = this.currentPlayerId();
          if (!pid) return list;
          const pool = this.playerPools[pid] || {};
          // sort: in-pool first by points desc, then others by strength desc
          return [...list].sort((a,b) => {
            const pa = pool[a.id]?.points || -1;
            const pb = pool[b.id]?.points || -1;
            if (pa !== pb) return pb - pa;
            return (b.strength || 0) - (a.strength || 0);
          });
        },
        assignToSelected(championId) {
          if (!this.selected.team || !this.selected.role) return;
          if (!this.roster[this.selected.team][this.selected.role]) return;
          this.assignments[this.selected.team][this.selected.role] = championId;
        },
        onDragChampion(e, championId) {
          e.dataTransfer.setData('type', 'champion');
          e.dataTransfer.setData('championId', String(championId));
          this.draggingChampion = true;
        },
        onDragPlayer(e, team, role) {
          const playerId = this.roster[team][role];
          e.dataTransfer.setData('type', 'player');
          e.dataTransfer.setData('team', team);
          e.dataTransfer.setData('role', role);
          e.dataTransfer.setData('playerId', String(playerId));
          this.draggingChampion = false;
        },
        onDropPlayer(e, team, role) {
          const type = e.dataTransfer.getData('type');
          if (type === 'player') {
            const fromTeam = e.dataTransfer.getData('team');
            const fromRole = e.dataTransfer.getData('role');
            const playerId = Number(e.dataTransfer.getData('playerId'));
            this.movePlayer(fromTeam, fromRole, team, role, playerId);
          } else if (type === 'champion') {
            const championId = Number(e.dataTransfer.getData('championId'));
            // Assign champion to the slot's player
            if (this.roster[team][role]) {
              const srcTeam = e.dataTransfer.getData('srcTeam');
              const srcRole = e.dataTransfer.getData('srcRole');
              this.assignments[team][role] = championId;
              if (srcTeam && srcRole && (srcTeam !== team || srcRole !== role)) {
                this.assignments[srcTeam][srcRole] = null;
              }
            }
          }
          this.draggingChampion = false;
        },
        onDragAssigned(e, team, role) {
          const cid = this.assignments[team][role];
          if (!cid) return;
          e.dataTransfer.setData('type', 'champion');
          e.dataTransfer.setData('championId', String(cid));
          e.dataTransfer.setData('srcTeam', team);
          e.dataTransfer.setData('srcRole', role);
          this.draggingChampion = true;
        },
        onDragEnd() { this.draggingChampion = false; },
        onDragReserve(e, team, playerId) {
          e.dataTransfer.setData('type', 'reserve');
          e.dataTransfer.setData('team', team);
          e.dataTransfer.setData('playerId', String(playerId));
        },
        onDropToReserves(e, team) {
          const type = e.dataTransfer.getData('type');
          if (type === 'player') {
            const fromTeam = e.dataTransfer.getData('team');
            const fromRole = e.dataTransfer.getData('role');
            const playerId = Number(e.dataTransfer.getData('playerId'));
            this.moveToReserves(fromTeam, fromRole, team, playerId);
          }
        },
        movePlayer(fromTeam, fromRole, toTeam, toRole, playerId) {
          // remove from source
          if (fromTeam && fromRole) {
            if (this.roster[fromTeam][fromRole] === playerId) this.roster[fromTeam][fromRole] = null;
          } else if (fromTeam && !fromRole) {
            // coming from reserves list; remove from reserves
            this.reserves[fromTeam] = this.reserves[fromTeam].filter(p => p.id !== playerId);
          }
          // if destination occupied, send that player to reserves
          const displaced = this.roster[toTeam][toRole];
          if (displaced) {
            const full = this.teamPlayers[toTeam].find(p => p.id === displaced);
            if (full) this.reserves[toTeam].push(full);
            // clear their champion assignment
            this.assignments[toTeam][toRole] = null;
          }
          this.roster[toTeam][toRole] = playerId;
          // clear assignment when moving
          this.assignments[toTeam][toRole] = null;
          // select the new slot
          this.selectSlot(toTeam, toRole);
        },
        moveToReserves(fromTeam, fromRole, toTeam, playerId) {
          if (this.roster[fromTeam][fromRole] === playerId) {
            this.roster[fromTeam][fromRole] = null;
            this.assignments[fromTeam][fromRole] = null;
          }
          const full = this.teamPlayers[fromTeam].find(p => p.id === playerId) || this.teamPlayers[toTeam].find(p => p.id === playerId);
          if (full) this.reserves[toTeam].push(full);
        },
        isSelected(team, role) { return this.selected.team === team && this.selected.role === role; },
        displayChampion(championId) {
          const c = this.champions.find(x => x.id === championId);
          if (!c) return `#${championId}`;
          const pi = this.poolInfoFor(championId);
          return `${c.name}${pi ? ' • '+pi.tier+' '+pi.points+'pts' : ''}`;
        },
        canSubmit() {
          if (!this.team1Id || !this.team2Id) return false;
          const allFilled = (team) => this.roles.every(r => !!this.roster[team][r]);
          const allAssigned = (team) => this.roles.every(r => !!this.assignments[team][r]);
          return allFilled('team1') && allFilled('team2') && allAssigned('team1') && allAssigned('team2');
        },
        async submitAndGo() {
          try {
            const mkRoster = (team) => this.roles.map(r => ({ role: r, player_id: this.roster[team][r], champion_id: this.assignments[team][r] }));
            const payload = {
              team1_id: this.team1Id,
              team2_id: this.team2Id,
              team1_roster: mkRoster('team1'),
              team2_roster: mkRoster('team2'),
            };
            const res = await fetch(this.api('/simulation/create'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error('Create failed');
            const data = await res.json();
            const sid = data.sim_id;
            // navigate to simulator page with sim_id
            window.location.href = `/page/simulator?sim_id=${encodeURIComponent(sid)}`;
          } catch (e) {
            console.error(e);
            this.error = 'Failed to create simulation';
          }
        },
      }
    }
  </script>
</div>
