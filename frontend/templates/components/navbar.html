<nav
  class="text-black border-b border-b-gray-300 dark:border-b-gray-700 dark:text-white bg-slate-50 dark:bg-slate-900 justify-between transition-all items-center flex px-4 shadow-sm h-[90px] top-0"
  :class="{ 'ml-64': expanded, 'ml-16': !expanded }"
  x-data="{ searchQuery: '', searchOpen: false, continueAction: window.continueActionState }"
  x-init="window.applyContinueAction = () => { continueAction = { ...window.continueActionState }; }; window.applyContinueAction();"
>
  <div class="flex flex-row items-center">
    <button
      @click="history.back()"
      class="p-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer"
      :disabled="history.length === 0"
      aria-label="Go back"
    >
      <i class="bi bi-chevron-left text-xl"></i>
    </button>
    <button
      @click="history.forward()"
      class="p-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer"
      :disabled="history.length === 0"
      aria-label="Go forward"
    >
      <i class="bi bi-chevron-right text-xl"></i>
    </button>
  </div>

  <div
    class="flex flex-row items-center font-bold text-2xl text-center px-4 self-center"
  >
    <div
      class="w-12 h-12 rounded-full bg-white/70 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center shadow"
    >
      <img
        class="w-10 h-10 object-contain"
        src="{{ url_for('static', path='img/g2-logo-clear.webp') }}"
        data-session-team-logo
        data-session-team-fallback="{{ url_for('static', path='img/g2-logo-clear.webp') }}"
        alt="Team logo"
      />
    </div>
    <div class="ml-4 place-self-center text-gray-600 dark:text-gray-300">
      <span data-session-team-name data-session-default="Your Team">Your Team</span>
    </div>
  </div>

  <div
    class="flex flex-grow max-w-xl items-center px-4 gap-4 overflow-visible relative"
  >
    <div class="relative w-full">
      <div
        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
      >
        <i class="bi bi-search text-gray-500 dark:text-gray-400"></i>
      </div>
      <input
        type="text"
        placeholder="Search players, teams, matches..."
        x-model="searchQuery"
        name="q"
        id="omni-search-input"
        @focus="searchOpen = true"
        @keydown.escape="searchOpen = false; searchQuery='';"
        hx-get="/api/moba/search"
        hx-target="#omni-results"
        hx-swap="innerHTML"
        hx-trigger="keyup changed delay:300ms"
        class="pl-10 pr-16 rounded-xl w-full py-3 bg-slate-200 hover:bg-gray-100 dark:bg-slate-600 dark:hover:bg-slate-500 focus:outline-none focus:ring focus:ring-blue-500 text-gray-800 dark:text-gray-200"
      />
      <div
        class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"
      >
        <kbd
          class="px-1.5 py-0.5 text-xs font-semibold text-gray-600 bg-gray-100 border border-gray-300 rounded-md dark:text-gray-400 dark:bg-gray-700 dark:border-gray-600"
          >/</kbd
        >
      </div>

      <!-- Search Results Dropdown (HTMX target) -->
      <div
        x-show="searchOpen && searchQuery && searchQuery.length > 1"
        @click.away="searchOpen = false"
        x-transition
        id="omni-results"
        class="absolute z-50 mt-2 w-full bg-white dark:bg-slate-800 rounded-md shadow-lg py-2 text-sm border border-gray-200 dark:border-gray-700 max-h-[400px] overflow-y-auto"
      ></div>
    </div>
  </div>

  <div class="flex items-center space-x-5 gap-4">
    <div class="hidden lg:flex flex-col text-right text-xs text-gray-500 dark:text-gray-400">
      <span
        class="font-semibold text-gray-700 dark:text-gray-200"
        data-session-save-name
        data-session-default="No active save"
        >No active save</span
      >
      <span>
        Day <span data-session-current-day data-session-default="1">1</span> •
        <span data-session-manager-name data-session-default="Manager">Manager</span>
      </span>
    </div>
    <div class="flex flex-col items-end">
      <button
        id="session-save-button"
        type="button"
        class="flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-white transition opacity-60 cursor-not-allowed"
        @click="window.saveActiveSession()"
        disabled
      >
        <i class="bi bi-cloud-arrow-up-fill"></i>
        Save Game
      </button>
      <span id="session-save-status" class="text-[11px] text-gray-500"></span>
    </div>
    <button
      @click="darkMode = !darkMode"
      class="rounded-full px-5 py-4 mx-1 bg-slate-200 hover:bg-gray-100 dark:bg-slate-600 dark:hover:bg-slate-500"
    >
      <span x-show="darkMode !== true">
        <i class="bi bi-moon-fill text-lg"></i>
      </span>
      <span x-show="darkMode === true">
        <i class="bi bi-sun-fill text-lg"></i>
      </span>
    </button>

    <button
      class="flex rounded-xl px-5 py-4 font-bold uppercase transition"
      :class="continueAction.enabled
        ? 'bg-blue-500 hover:bg-blue-400 text-white'
        : 'bg-slate-200 text-slate-400 dark:bg-slate-700 dark:text-slate-400 cursor-not-allowed'"
      :disabled="!continueAction.enabled"
      :title="continueAction.enabled ? '' : continueAction.tooltip"
      @click="
        if (!continueAction.enabled) { return; }
        if (continueAction.onClick) {
          const handler = typeof continueAction.onClick === 'function'
            ? continueAction.onClick
            : window[continueAction.onClick];
          if (typeof handler === 'function') {
            handler();
            return;
          }
        }
        if (continueAction.href) {
          window.location.href = continueAction.href;
        }
      "
    >
      <span x-text="continueAction.label"></span>
      <span class="ml-4 text-lg">
        <i class="bi bi-arrow-right-circle-fill"></i>
      </span>
    </button>
  </div>
</nav>
