<!-- Teams Skeleton Loading State -->
<div hx-trigger="load" hx-get="/api/moba/teams" hx-indicator="#loading-indicator" hx-swap="innerHTML">
  <!-- Grid View Skeleton -->
  <div x-show="view === 'grid'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <!-- Repeat skeleton cards -->
    {% for i in range(8) %}
    <div class="bg-white dark:bg-slate-700 rounded-lg shadow overflow-hidden">
      <div class="relative">
        <!-- Banner Skeleton -->
        <div class="w-full h-32 bg-gray-200 dark:bg-slate-600 animate-pulse"></div>
        
        <!-- Logo Skeleton -->
        <div class="absolute -bottom-10 left-1/2 transform -translate-x-1/2 bg-white dark:bg-slate-800 rounded-full h-20 w-20 flex items-center justify-center border-4 border-white dark:border-slate-700">
          <div class="h-16 w-16 rounded-full bg-gray-200 dark:bg-slate-600 animate-pulse"></div>
        </div>
        
        <!-- Badge Skeletons -->
        <div class="absolute top-2 left-2 bg-gray-200 dark:bg-slate-600 h-5 w-12 rounded-full animate-pulse"></div>
        <div class="absolute top-2 right-2 bg-gray-200 dark:bg-slate-600 h-6 w-8 rounded-md animate-pulse"></div>
      </div>
      
      <div class="p-4 pt-12">
        <!-- Team Name Skeleton -->
        <div class="text-center mb-3">
          <div class="h-6 bg-gray-200 dark:bg-slate-600 rounded w-32 mx-auto animate-pulse mb-2"></div>
          <div class="flex items-center justify-center">
            <div class="h-4 w-6 bg-gray-200 dark:bg-slate-600 rounded animate-pulse mr-2"></div>
            <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-16 animate-pulse"></div>
          </div>
        </div>
        
        <!-- Stats Skeleton -->
        <div class="grid grid-cols-3 gap-2 mb-4">
          {% for j in range(3) %}
          <div class="text-center">
            <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-16 mx-auto animate-pulse mb-2"></div>
            <div class="h-6 bg-gray-200 dark:bg-slate-600 rounded w-8 mx-auto animate-pulse"></div>
          </div>
          {% endfor %}
        </div>
        
        <!-- Tier Skeleton -->
        <div class="flex items-center justify-center mb-3">
          <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-36 animate-pulse"></div>
        </div>
        
        <!-- Players Skeleton -->
        <div class="text-center mb-4">
          <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-20 mx-auto animate-pulse mb-2"></div>
          <div class="flex justify-center space-x-1">
            {% for k in range(5) %}
            <div class="h-6 w-6 bg-gray-200 dark:bg-slate-600 rounded-full animate-pulse"></div>
            {% endfor %}
          </div>
        </div>
        
        <!-- Actions Skeleton -->
        <div class="flex justify-between">
          <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-20 animate-pulse"></div>
          <div class="h-5 bg-gray-200 dark:bg-slate-600 rounded-full w-24 animate-pulse"></div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  
  <!-- List View Skeleton -->
  <div x-show="view === 'list'" class="bg-white dark:bg-slate-700 rounded-lg shadow overflow-x-auto mb-6">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-600">
      <thead>
        <tr class="bg-gray-50 dark:bg-slate-800">
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Team</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Region</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">League</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Rating</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Championships</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Tier</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white dark:bg-slate-700 divide-y divide-gray-200 dark:divide-gray-600">
        {% for i in range(10) %}
        <tr>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10 bg-gray-200 dark:bg-slate-600 rounded-full animate-pulse"></div>
              <div class="ml-4">
                <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-24 animate-pulse mb-2"></div>
                <div class="h-3 bg-gray-200 dark:bg-slate-600 rounded w-16 animate-pulse"></div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="h-4 w-6 bg-gray-200 dark:bg-slate-600 rounded animate-pulse mr-2"></div>
              <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-16 animate-pulse"></div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="h-5 bg-gray-200 dark:bg-slate-600 rounded w-12 animate-pulse"></div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-8 animate-pulse mb-1"></div>
            <div class="h-2 bg-gray-200 dark:bg-slate-600 rounded w-24 animate-pulse"></div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="h-5 bg-gray-200 dark:bg-slate-600 rounded w-8 animate-pulse mx-auto"></div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="h-5 bg-gray-200 dark:bg-slate-600 rounded w-14 animate-pulse"></div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex space-x-3">
              <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-10 animate-pulse"></div>
              <div class="h-4 bg-gray-200 dark:bg-slate-600 rounded w-14 animate-pulse"></div>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  
  <!-- Loading Indicator -->
  <div class="flex justify-center items-center my-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 dark:border-blue-400"></div>
    <span class="ml-2 text-gray-600 dark:text-gray-400">Loading teams...</span>
  </div>
</div>
