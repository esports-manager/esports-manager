<div
  class="m-8"
  x-data="{
  championsActiveTab: $persist('champions').using(sessionStorage),
  view: $persist('grid').using(sessionStorage),
  searchQuery: '',
  selectedRole: '',
  selectedDifficulty: '',
  selectedMetaTier: '',
  selectedPatch: '',
  sortBy: 'name',
  sortDirection: 'asc',
  metaTab: 'overview',
  perPage: '20',
  showFilters: false,
  updateChampionsList() {
    // Ensure x-model updates are flushed before submitting via HTMX
    this.$nextTick(() => {
      htmx.trigger('#champion-filters-form', 'submit');
    });
  }
}"
>
  <!-- Page Header -->
  <div
    class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6"
  >
    <div>
      <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">
        Champions
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Browse champions and current meta trends
      </p>
    </div>

    <!-- View Toggle -->
    <div class="flex items-center bg-gray-100 dark:bg-slate-700 rounded-lg p-1">
      <button
        @click="view = 'grid'"
        :class="{'bg-white dark:bg-slate-600 shadow': view === 'grid'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150"
      >
        <i class="bi bi-grid mr-1"></i> Grid
      </button>
      <button
        @click="view = 'list'"
        :class="{'bg-white dark:bg-slate-600 shadow': view === 'list'}"
        class="px-3 py-1 rounded-md text-sm font-medium transition-colors duration-150"
      >
        <i class="bi bi-list-ul mr-1"></i> List
      </button>
    </div>
  </div>

  <!-- Main Navigation Tabs -->
  <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
    <div class="flex overflow-x-auto overflow-y-hidden">
      <button
        @click="championsActiveTab = 'champions'"
        :class="{'border-blue-500 text-blue-600 dark:text-blue-400': championsActiveTab === 'champions', 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300': championsActiveTab !== 'champions'}"
        class="flex items-center h-14 px-4 -mb-px text-sm font-medium border-b-2 whitespace-nowrap focus:outline-none"
      >
        <i class="bi bi-file-earmark-text mr-2"></i>
        Champions
      </button>
      <button
        @click="championsActiveTab = 'meta'"
        :class="{'border-blue-500 text-blue-600 dark:text-blue-400': championsActiveTab === 'meta', 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300': championsActiveTab !== 'meta'}"
        class="flex items-center h-14 px-4 -mb-px text-sm font-medium border-b-2 whitespace-nowrap focus:outline-none"
      >
        <i class="bi bi-lightning mr-2"></i>
        Meta
      </button>
    </div>
  </div>

  <!-- Meta Overview Section -->
  <div
    x-show="championsActiveTab === 'meta'"
    class="bg-white dark:bg-slate-700 rounded-lg shadow mb-6 overflow-hidden"
  >
    {% include "components/champions/champions_meta.html" %}
  </div>

  <div x-show="championsActiveTab === 'champions'">
    <!-- Filters and Search Section -->
    {% include "components/champions/champions_tab.html" %}

    <div id="champ-list">
      <div id="champions-container">
        {% include "components/champions/champions_skeleton.html" %}
      </div>
    </div>
  </div>
</div>
