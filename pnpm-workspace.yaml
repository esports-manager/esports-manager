# Dependency install scripts are blocked unless listed here.
# lefthook: git hooks are installed on request with `just hooks`, not on install.
allowBuilds:
  # The Tauri smoke test talks to tauri-driver; browser drivers aren't used.
  edgedriver: false
  geckodriver: false
  lefthook: false

# Pin exact versions; upgrades are deliberate changes.
saveExact: true
