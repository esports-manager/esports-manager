<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>eSports Manager - Load Game</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='img/icons/bootstrap-icons.min.css') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/imgblur.css') }}" />
  </head>
  <body class="text-white">
    <div class="bg-blur"></div>

    <div
      class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12"
    >
      <div class="flex flex-col items-center gap-4 mb-8">
        <img
          id="logo"
          class="w-20 h-20"
          src="{{ url_for('static', path='img/logo.svg') }}"
          alt="eSports Manager"
        />
        <div class="text-center">
          <h1 class="text-3xl font-semibold">Load a Career</h1>
          <p class="text-sm text-white/70">
            Pick a saved session to continue your season.
          </p>
        </div>
      </div>

      <div
        class="w-full max-w-3xl bg-white/90 text-slate-900 rounded-2xl shadow-2xl p-8 backdrop-blur"
      >
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-semibold">Saved Sessions</h2>
            <p class="text-sm text-slate-500">Select a save to jump back in.</p>
          </div>
          <a
            href="/"
            class="text-sm font-semibold text-blue-600 hover:text-blue-500"
            >Back to menu</a
          >
        </div>

        <div id="sessions-container" class="space-y-4"></div>

        <p id="load-game-empty" class="text-sm text-slate-500 hidden">
          No saved sessions yet. Start a new game to create one.
        </p>
        <p id="load-game-error" class="text-sm text-red-600"></p>

        <div class="flex items-center justify-between mt-6">
          <a
            href="/new_game"
            class="text-sm font-semibold text-slate-600 hover:text-slate-500"
            >Create a new save</a
          >
          <button
            id="refresh-sessions"
            type="button"
            class="px-4 py-2 rounded-xl text-white bg-blue-600 hover:bg-blue-500 text-sm font-semibold"
          >
            Refresh list
          </button>
        </div>
      </div>
    </div>

    <script>
      const sessionsContainer = document.getElementById("sessions-container");
      const emptyEl = document.getElementById("load-game-empty");
      const errorEl = document.getElementById("load-game-error");
      const refreshBtn = document.getElementById("refresh-sessions");

      function renderSessions(sessions) {
        sessionsContainer.innerHTML = "";
        if (!sessions.length) {
          emptyEl.classList.remove("hidden");
          return;
        }
        emptyEl.classList.add("hidden");
        sessions.forEach((session) => {
          const card = document.createElement("div");
          card.className =
            "border border-slate-200 rounded-xl p-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between";

          card.innerHTML = `
            <div>
              <h3 class="text-lg font-semibold text-slate-900">${session.name}</h3>
              <p class="text-sm text-slate-500">Manager: ${session.manager_name}</p>
              <p class="text-xs text-slate-400">Team ID: ${session.team_id} • Day ${session.current_day}</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
              <button
                data-session-id="${session.id}"
                class="load-session-btn px-4 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-500"
              >
                Continue
              </button>
            </div>
          `;

          sessionsContainer.appendChild(card);
        });

        document.querySelectorAll(".load-session-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const sessionId = btn.dataset.sessionId;
            localStorage.setItem("activeSessionId", sessionId);
            window.location.href = `/home?session_id=${sessionId}`;
          });
        });
      }

      async function loadSessions() {
        errorEl.textContent = "";
        try {
          const response = await fetch("/api/moba/sessions");
          if (!response.ok) {
            throw new Error("Unable to load saved sessions.");
          }
          const sessions = await response.json();
          renderSessions(sessions);
        } catch (error) {
          errorEl.textContent = error.message;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadSessions();
        refreshBtn.addEventListener("click", loadSessions);
      });
    </script>
  </body>
</html>
